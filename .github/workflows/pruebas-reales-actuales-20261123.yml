name: Prueba de arranque para pruebas reales

on:
  push:
    branches:
      - work/pruebas-reales-20261123
    paths:
      - .github/workflows/pruebas-reales-actuales-20261123.yml

permissions:
  contents: read

jobs:
  prueba-arranque:
    runs-on: ubuntu-24.04
    steps:
      - name: Comprobar autorización exacta
        shell: bash
        env:
          ASEN_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "$ASEN_COMMIT_MESSAGE" = "ci(asen): validar arranque pruebas reales 20261123"
          echo "Arranque de GitHub Actions confirmado para el SHA $GITHUB_SHA"
