name: Pruebas reales NVIDIA de Writers y recuperación

on:
  push:
    branches:
      - work/pruebas-reales-20261123
    paths:
      - .github/workflows/pruebas-reales-actuales-20261123.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: pruebas-reales-actuales-${{ github.ref }}
  cancel-in-progress: false

jobs:
  writers-nvidia:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'push' &&
      github.actor == 'asenbanskaliev' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci(asen): ejecutar Writer NVIDIA real 20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ASEN_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Comprobar autorización exacta
        shell: bash
        env:
          ASEN_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "$ASEN_COMMIT_MESSAGE" = "ci(asen): ejecutar Writer NVIDIA real 20261123"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Comprobar SHA y tipo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Preparar Pi 1.2
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts tsx@4.23.15 @earendil-works/pi-coding-agent@1.2.0
          test "$(pi --version | tr -d '\r')" = "1.2.0"
      - name: Ejecutar dos Writers NVIDIA reales en paralelo
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ASEN_E2A_NVIDIA_REPORT: ${{ runner.temp }}/asen-e2a-writers/receipt.json
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-e2a-pi-config
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY"
          mkdir -p "$PI_CODING_AGENT_DIR"
          node scripts/t12-pi-retry-settings.mjs
          timeout 360s tsx scripts/e2a-nvidia-dual-writer-trial.ts
      - name: Guardar recibo de Writers
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: prueba-real-writers-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-e2a-writers/receipt.json
          if-no-files-found: warn
          retention-days: 30

  recuperacion-nvidia:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'push' &&
      github.actor == 'asenbanskaliev' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci(asen): repetir recuperación NVIDIA tras corrección 20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      ASEN_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Comprobar autorización exacta
        shell: bash
        env:
          ASEN_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "$ASEN_COMMIT_MESSAGE" = "ci(asen): repetir recuperación NVIDIA tras corrección 20261123"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.19.0"
      - name: Instalar Pi 1.2 y validar el SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund @earendil-works/pi-coding-agent@1.2.0
          test "$(node -p 'require("./node_modules/@earendil-works/pi-coding-agent/package.json").version')" = "1.2.0"
      - name: Ejecutar interrupción y recuperación NVIDIA real
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ASEN_ECO07_PROVIDER: nvidia
          ASEN_ECO07_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY"
          mkdir -p eco07-pi-evidence
          node --import tsx scripts/eco07-pi-recovery-e2e.mjs
      - name: Guardar recibo de recuperación
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: prueba-real-recuperacion-${{ github.sha }}-${{ github.run_id }}
          path: eco07-pi-evidence/
          if-no-files-found: warn
          retention-days: 30
