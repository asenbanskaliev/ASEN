name: Prueba real Writer NVIDIA

on:
  push:
    branches:
      - work/pruebas-reales-20261123
    paths:
      - .github/workflows/pruebas-reales-actuales-20261123.yml

permissions:
  contents: read

jobs:
  writers-nvidia:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ASEN_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Comprobar autorización exacta
        shell: bash
        env:
          ASEN_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "$ASEN_COMMIT_MESSAGE" = "ci(asen): validar bloque writer 20261123"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Comprobar SHA y tipo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Preparar Pi 1.2 sin ejecutar proveedor
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts tsx@4.23.15 @earendil-works/pi-coding-agent@1.2.0
          test "$(pi --version | tr -d '\r')" = "1.2.0"
