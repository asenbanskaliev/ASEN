name: E2A NVIDIA dos escritores Pi, ensayo único
on:
  push:
    branches:
      - feat/e2a-nvidia-dos-writers-20261123
    paths:
      - .github/workflows/asen-e2a-nvidia-dos-writers.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: e2a-nvidia-una-vez-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ensayo:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'push' &&
      github.actor == 'asenbanskaliev' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci(asen): autorizar E2A controlado sin aprobaciones 20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      ASEN_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
      # Aprobación previa del propietario para un ensayo sintético delimitado.
      # Se comprueba una sola ejecución en GitHub antes de entregar el secreto.
      # No desactiva las aprobaciones individuales de Writers en proyectos reales.
      - name: Comprobar permiso único de gasto sin aprobación personal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASEN_COST_MARKER: 'ci(asen): autorizar E2A controlado sin aprobaciones 20261123'
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = "refs/heads/feat/e2a-nvidia-dos-writers-20261123"
          curl --retry 0 -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=feat%2Fe2a-nvidia-dos-writers-20261123&event=push&per_page=100" \
            -o "$RUNNER_TEMP/e2a-ejecuciones.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const data=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/e2a-ejecuciones.json","utf8"));
          if(!Array.isArray(data.workflow_runs)||!Number.isInteger(data.total_count)||data.total_count>100)
            throw Error("Registro GitHub incompleto: gasto bloqueado");
          const matches=data.workflow_runs.filter(run=>
            run.name==="E2A NVIDIA dos escritores Pi, ensayo único"&&
            run.event==="push"&&run.head_commit?.message===process.env.ASEN_COST_MARKER
          );
          if(matches.length!==1||matches[0].id!==Number(process.env.GITHUB_RUN_ID))
            throw Error("Permiso NVIDIA ya usado, repetido o no verificable: gasto bloqueado");
          process.stdout.write("Permiso E2A único verificado para esta ejecución.\n");
          NODE
      - name: Validar código y SHA antes de consumir NVIDIA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          node --import tsx --test tests/t06-live-consent.test.ts tests/e2a-native-skills-fixture.test.ts
      - name: Comprobar versión nativa Pi
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts tsx@4.23.15 @earendil-works/pi-coding-agent@1.2.0
          pi --version
      # Reintento único tras bloqueo anterior SIN procesos Pi (recibo 45150347851).
      # Una única prueba tras corregir la lectura Git y exigir diagnóstico de errores de escritura.
      - name: Ejecutar dos Writers NVIDIA una única vez sobre archivos sintéticos
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-e2a-pi-config
          ASEN_E2A_NVIDIA_REPORT: ${{ runner.temp }}/asen-e2a-writers/receipt.json
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY" || { echo "::error::Falta la clave NVIDIA"; exit 1; }
          mkdir -p "$PI_CODING_AGENT_DIR"
          node scripts/t12-pi-retry-settings.mjs
          timeout 300s tsx scripts/e2a-nvidia-dual-writer-trial.ts
      - name: Guardar recibo mínimo sin credenciales
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: e2a-nvidia-dos-writers-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-e2a-writers/receipt.json
          if-no-files-found: warn
          retention-days: 14
