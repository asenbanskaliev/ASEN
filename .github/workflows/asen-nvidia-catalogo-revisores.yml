name: Consultar catálogo NVIDIA para revisar T06
# Se consultan identificadores públicos; cero llamadas de inferencia.
on:
  push:
    branches:
      - feat/flujo-de-agentes-20261115
    paths:
      - .github/workflows/asen-nvidia-catalogo-revisores.yml
permissions:
  contents: read
jobs:
  obtener-modelos:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'push' &&
      github.actor == 'asenbanskaliev' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/feat/flujo-de-agentes-20261115' &&
      github.event.head_commit.message == 'ci(asen): comprobar catálogo real de revisores NVIDIA'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
      - name: Consultar solo modelos, sin generar texto
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$NVIDIA_API_KEY"
          timeout 50s node scripts/t06-model-catalog-readonly.mjs
