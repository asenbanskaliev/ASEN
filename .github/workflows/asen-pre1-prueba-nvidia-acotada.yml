name: ASEN PRE-1 prueba real NVIDIA acotada
# Prueba separada: NO concede autorización Writer ni revisión T06.
# Una sola oportunidad en rama temporal, dos llamadas HTTP como máximo.
on:
  push:
    branches:
      - test/ci-pre1-nvidia-real-20261121
    paths:
      - .github/workflows/asen-pre1-prueba-nvidia-acotada.yml
permissions:
  contents: read
concurrency:
  group: asen-pre1-nvidia-acotada-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comprobar-seguridad-sin-proveedor:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/test/ci-pre1-nvidia-real-20261121' &&
      github.event.before == 'ed49ef9c646e156b467aab988c7e4b664ed510c7' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci(asen): validar PRE-1 con NVIDIA real acotado'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: '24'
      - name: Comprobar candidato exacto y cambio único
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          test "$changed" = ".github/workflows/asen-pre1-prueba-nvidia-acotada.yml"
      - name: Ejecutar pruebas negativas ANTES de exponer NVIDIA
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          node --import tsx --test tests/upstream-reference-policy.test.ts tests/t06-review-authorization-conduct.test.ts tests/t06-auto-review-authority.test.ts
          npm run audit:upstream-boundary
          test -z "$(git status --porcelain=v1)"
  prueba-real-nvidia:
    needs: [comprobar-seguridad-sin-proveedor]
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/test/ci-pre1-nvidia-real-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: '24'
      - name: Validar respuesta real NVIDIA sin herramientas ni escritura
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ASEN_NVIDIA_PROBE_REPORT: ${{ runner.temp }}/asen-pre1-nvidia/resultado.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -n "$NVIDIA_API_KEY"
          timeout 90s node scripts/t06-nvidia-free-api-probe.mjs
      - name: Guardar solo metadatos de las respuestas
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-pre1-nvidia-acotada-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-pre1-nvidia/resultado.json
          if-no-files-found: warn
          retention-days: 14
