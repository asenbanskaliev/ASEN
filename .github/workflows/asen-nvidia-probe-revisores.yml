name: Diagnosticar modelos NVIDIA por API sin reintentos
# Diagnóstico independiente del protocolo nativo Pi.
on:
  push:
    branches:
      - feat/flujo-de-agentes-20261115
    paths:
      - .github/workflows/asen-nvidia-probe-revisores.yml
permissions:
  contents: read
jobs:
  dos-pruebas:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'push' &&
      github.actor == 'asenbanskaliev' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/feat/flujo-de-agentes-20261115' &&
      github.event.head_commit.message == 'ci(asen): diagnosticar modelos NVIDIA reales una vez'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
      - name: Hacer dos peticiones de máximo 48 tokens sin repetición
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ASEN_NVIDIA_DIAG_REPORT: ${{ runner.temp }}/asen-nvidia-diag/resultados.json
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout 120s node scripts/t06-probe-modelos-revisores.mjs
      - name: Guardar códigos HTTP sin respuestas privadas
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-nvidia-diagnostico-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-nvidia-diag/resultados.json
          if-no-files-found: warn
          retention-days: 14
