name: ASEN real-agent functional acceptance

# Bounded opt-in verifies direct provider and genuine read-only Dispatcher; no lifecycle bypass or Writer grant.
on:
  push:
    branches:
      - feat/t12-integrated-acceptance-merge
    paths:
      - .github/workflows/asen-real-agent-acceptance.yml
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - .github/workflows/**
      - extensions/**
      - src/**
      - scripts/t12-*.mjs
      - scripts/t12-parent-probe.ts
      - scripts/agent-ab-*.mjs
      - registry/parity/agent-ab-baselines-v1.json
      - tests/**
  workflow_dispatch:
    inputs:
      os:
        description: Hosted runner for the Beam/Ollama acceptance lane
        required: true
        type: choice
        options:
          - ubuntu-24.04
      max-inference-calls:
        description: Documented upper bound for provider calls made by this run
        required: true
        type: choice
        options:
          - "3"
          - "5"
permissions:
  contents: read
concurrency:
  group: asen-real-agent-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-static-validation:
    if: github.repository == 'asenbanskaliev/ASEN'
    name: Provider-free static and ASEN validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse 'HEAD^{commit}')"
          mkdir -p asen-acceptance-evidence
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: F7 audit EF checklist and check its negative regression tests
        run: npm run audit:ef-plan && node --import tsx --test tests/audit-ef-plan.test.ts
      - name: Focused profile, routing, reviewer, verifier and authorization tests
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            tests/profile-selection.test.ts \
            tests/profile-routing-real.test.ts \
            tests/orchestrator.test.ts \
            tests/functional-role-parity-matrix.test.ts \
            tests/agent-observable-parity.test.ts \
            tests/agent-observable-scaffold.test.ts \
            tests/agent-observable-receipts.test.ts \
            tests/agent-ab-source-witness.test.ts \
            tests/frozen-ecosystem-source.test.ts \
            tests/natural-plan-tool.test.ts \
            tests/orchestrator-dispatcher-integration.test.ts \
            tests/agent-terminal-delivery.test.ts \
            tests/explorer-budget.test.ts \
            tests/session-notifications.test.ts \
            tests/notification-projection.test.ts \
            tests/plan-dispatcher-role-boundaries.test.ts \
            tests/review-acceptance.test.ts \
            tests/plan-dispatcher-candidate-guard.test.ts \
            tests/executable-plan-candidate-propagation.test.ts \
            tests/task-agent-coordinator.test.ts \
            tests/task-agent-automation.test.ts \
            tests/pi-verifier-exit.test.ts \
            tests/pi-model-reviewer.test.ts \
            tests/writer-authorization-snapshot.test.ts \
            tests/permission-modes.test.ts \
            tests/ef001-confirmation-regressions.test.ts \
            tests/auto-permission-reviewer.test.ts \
            tests/auto-permission-evidence.test.ts \
            tests/yolo-temp-scratch.test.ts
      - name: F6 interruption, restart, authorization and provider failure regressions
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            tests/agent-store.test.ts \
            tests/agent-coalesce-multiprocess.test.ts \
            tests/odd-task-tracking.test.ts \
            tests/authorized-write-recovery.test.ts \
            tests/eco06-interrupted-writer.test.ts \
            tests/eco07-provider-failure.test.ts \
            tests/background-job-journal.test.ts \
            tests/agent-notification-multiprocess.test.ts \
            tests/agent-notification-journal.test.ts \
            tests/pi-process-runner.test.ts \
            tests/pi-session-recovery-e2e.test.ts \
            tests/session-recovery-e2e.test.ts
      - name: F6 cross-process inference recovery, corruption and negative checks
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/t12-inference-budget.test.ts
      - name: F2/F3 deterministic fixture and planning contracts
        shell: bash
        run: node --import tsx --test tests/t12-real-agent-fixture.test.ts tests/t12-plan-grader.test.ts tests/t12-review-grader.test.ts tests/t12-verifier-brief.test.ts tests/t12-parent-consumption-grade.test.ts tests/t12-real-provider-workflow.test.ts tests/t12-provider-failure.test.ts tests/t12-disposable-correction.test.ts tests/t12-live-evidence-gate.test.ts tests/t12-explorer-schema.test.ts tests/t12-acceptance-ledger.test.ts
      - name: Ollama scoped child credential regression
        run: node --import tsx --test tests/t12-ollama-child-credential.test.ts
      - name: Pi retry settings preserve installed extensions
        run: node --import tsx --test tests/t12-pi-retry-settings.test.ts
      - name: F1/F2/F6 Pi runtime event, budget and duplicate-start regression (mock runner)
        run: node --import tsx --test --test-name-pattern='EF-201|EF-601|EF-603|EF-202|EF-604' tests/pi-agent-runtime.test.ts
      - name: F7 create exact-SHA provider-free acceptance ledger (never claim FULL)
        env:
          ASEN_OFFLINE_TESTS_PASSED: '1'
          ASEN_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/t12-acceptance-ledger.mjs
      - name: Validate repository diff hygiene
        run: git diff --check
      - name: Preserve provider-free validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-acceptance-offline-${{ github.sha }}-${{ github.run_id }}
          path: asen-acceptance-evidence/
          if-no-files-found: warn
          retention-days: 14


  ab-frozen-source-witness:
    needs: offline-static-validation
    if: github.repository == 'asenbanskaliev/ASEN'
    name: Frozen A/B source objects (source-only, not real C01-C20)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - name: Verify exact upstream A and B Git objects without running either upstream
        shell: bash
        env:
          ASEN_AB_WITNESS_OUTPUT: ${{ github.workspace }}/asen-acceptance-evidence/ab-source-witness.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p asen-acceptance-evidence
          node scripts/agent-ab-source-witness.mjs
          node -e 'const w=require("./asen-acceptance-evidence/ab-source-witness.json"); if(w.checkedSources!==2||w.executedCases!==0||w.globalFull!==false||w.runtimeAttested!==false)process.exit(1);'
      - name: Preserve only source provenance (no fabricated behavioral capture)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-ab-source-only-${{ github.sha }}-${{ github.run_id }}
          path: asen-acceptance-evidence/ab-source-witness.json
          if-no-files-found: warn
          retention-days: 14

  real-parent-consumption:
    needs: offline-static-validation
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.ref == 'refs/heads/feat/t12-integrated-acceptance-merge' &&
      github.run_attempt == 1 &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ci: one-time Pi parent Beam proof'
    name: Real Pi parent notices with Ollama Beam (read-only fixture child)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: ollama-cloud-beam
    permissions:
      contents: read
    env:
      ASEN_EXPECTED_SHA: ${{ github.sha }}
      ASEN_OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      PI_OLLAMA_WEB_TOOLS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - name: Install pinned Beam provider into isolated Pi home
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/asen-pi-parent"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          mkdir -p "$PI_CODING_AGENT_DIR"
          test -n "$ASEN_OLLAMA_API_KEY" || { echo "::error::Ollama Cloud authentication missing"; exit 1; }
          OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY" node_modules/.bin/pi install npm:pi-ollama-cloud@0.13.1
          OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY" PI_OLLAMA_WEB_TOOLS=0 node_modules/.bin/pi --list-models > "$RUNNER_TEMP/asen-parent-models.txt"
          awk '$1 == "ollama-cloud" {print $2}' "$RUNNER_TEMP/asen-parent-models.txt" > "$RUNNER_TEMP/asen-parent-model-ids.txt"
          if grep -Fxq "beam:cloud" "$RUNNER_TEMP/asen-parent-model-ids.txt"; then
            selected="beam:cloud"
          elif grep -Fxq "beam" "$RUNNER_TEMP/asen-parent-model-ids.txt"; then
            selected="beam"
          else
            echo "::error::No pinned Beam alias available"; exit 1
          fi
          printf '%s\n' "$selected" > "$RUNNER_TEMP/asen-parent-selected-model"
          echo "Native Pi parent selected one registered Beam model; no paid fallback"
      - name: Prove one native Pi TUI idle wake and coordinator acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/asen-pi-parent"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          export ASEN_SELECTED_MODEL="$(cat "$RUNNER_TEMP/asen-parent-selected-model")"
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          mkdir -p asen-acceptance-evidence
          timeout 160s node scripts/t12-real-parent-consumption.mjs
      - name: Preserve source-bound real Pi parent receipt, or explicit absence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-parent-real-${{ github.sha }}-${{ github.run_id }}
          path: asen-acceptance-evidence/real-pi-parent-wake.json
          if-no-files-found: warn
          retention-days: 14

  real-provider-acceptance:
    needs: offline-static-validation
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.ref == 'refs/heads/feat/t12-integrated-acceptance-merge' &&
      github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.head_commit.message == 'ci: one-time Ollama Cloud provider smoke'))
    name: Real Ollama Cloud functional acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: ollama-cloud-beam
    permissions:
      contents: read
    env:
      ASEN_PROVIDER: ollama-cloud
      ASEN_MODEL: beam:cloud
      ASEN_STRICT_INFERENCE_ORDER: '1'
      ASEN_MAX_INFERENCE_CALLS: ${{ inputs.max-inference-calls || '5' }}
      ASEN_OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - name: Verify bundled Pi runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          if test -f node_modules/.bin/pi; then ./node_modules/.bin/pi --version; fi
      - name: Install pinned Ollama Cloud provider extension
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/asen-pi-home"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          mkdir -p "$PI_CODING_AGENT_DIR"
          test -n "$OLLAMA_API_KEY" || { echo "::error::OLLAMA_API_KEY missing"; exit 1; }
          node_modules/.bin/pi install npm:pi-ollama-cloud@0.13.1
          mkdir -p asen-acceptance-evidence
          node scripts/t12-pi-retry-settings.mjs > asen-acceptance-evidence/pi-retry-settings.json
          PI_OLLAMA_WEB_TOOLS=0 node_modules/.bin/pi --list-models > "$RUNNER_TEMP/asen-ollama-models.txt"
          mkdir -p asen-acceptance-evidence
          # Pi lists provider and model in columns. Capture only IDs; never persist credentials.
          awk '$1 == "ollama-cloud" {print $2}' "$RUNNER_TEMP/asen-ollama-models.txt" > asen-acceptance-evidence/registered-model-ids.txt
          if ! test -s asen-acceptance-evidence/registered-model-ids.txt; then
            echo "::error::No Ollama Cloud models registered; inspect provider load, credential and catalog refresh"
            exit 1
          fi
          if grep -Fxq "$ASEN_MODEL" asen-acceptance-evidence/registered-model-ids.txt; then
            selected="$ASEN_MODEL"
          elif grep -Fxq "beam" asen-acceptance-evidence/registered-model-ids.txt; then
            # The pinned cloud provider currently advertises this canonical Beam ID.
            selected="beam"
            echo "::notice::Using registered Beam alias; no unrelated model fallback permitted"
          else
            echo "::error::Neither the pinned Beam model nor its registered alias is available; refusing any model inference"
            exit 1
          fi
          printf '%s\n' "$selected" > "$RUNNER_TEMP/asen-selected-model"
          echo "Selected one Ollama Cloud model from live Pi registration"
      - name: Bounded Ollama Cloud provider smoke
        shell: bash
        run: |
          set -euo pipefail
          if test "$ASEN_MAX_INFERENCE_CALLS" != "3"; then
            echo "Skipping standalone smoke so the five-call budget covers Explorer, Planner, two blind reviewers and Verifier."
            exit 0
          fi
          test -n "${ASEN_OLLAMA_API_KEY}" || { echo "::error::OLLAMA_API_KEY is not configured"; exit 1; }
          if ! test -f node_modules/.bin/pi; then echo "::error::No Pi runtime is available in the installed dependencies"; exit 1; fi
          node scripts/t12-inference-budget.mjs provider-connectivity
          export HOME="$RUNNER_TEMP/asen-pi-home"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          export PI_OLLAMA_WEB_TOOLS=0
          mkdir -p "$HOME/.asen"
          export OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY"
          mkdir -p asen-acceptance-evidence
          printf '%s\n' 'Reply with exactly ASEN_PROVIDER_OK' > asen-acceptance-evidence/provider-smoke.prompt
          export PI_PROVIDER=ollama-cloud
          selected="$(cat "$RUNNER_TEMP/asen-selected-model")"
          timeout 90s node_modules/.bin/pi --provider ollama-cloud --model "$selected" --no-session --print "Reply with exactly ASEN_PROVIDER_OK" > asen-acceptance-evidence/provider-smoke.jsonl
          grep -q "ASEN_PROVIDER_OK" asen-acceptance-evidence/provider-smoke.jsonl
          echo "provider smoke passed within the declared inference budget"
      - name: Real ASEN Dispatcher explorer with Ollama Cloud (read-only)
        shell: bash
        env:
          ASEN_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          export HOME="$RUNNER_TEMP/asen-pi-home"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          export PI_OLLAMA_WEB_TOOLS=0
          export OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY"
          node --import tsx scripts/t12-ollama-asen-dispatcher.mjs
      - name: Real model planning on graded ASEN Explorer findings
        shell: bash
        env:
          ASEN_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          export HOME="$RUNNER_TEMP/asen-pi-home"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          export PI_OLLAMA_WEB_TOOLS=0
          export OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY"
          node --import tsx scripts/t12-real-model-plan.mjs
      - name: Real ASEN Reviewer (two blind judgments) and Verifier reject deliberate defects
        shell: bash
        if: env.ASEN_MAX_INFERENCE_CALLS == '5'
        env:
          ASEN_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          export HOME="$RUNNER_TEMP/asen-pi-home"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          export PI_OLLAMA_WEB_TOOLS=0
          export OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY"
          node --import tsx scripts/t12-real-review-verifier.mjs
      - name: Record read-only review stages deferred at call budget
        if: env.ASEN_MAX_INFERENCE_CALLS == '3'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"status":"BLOCKED_CALL_BUDGET","reviewer":"NOT_RUN","verifier":"NOT_RUN","authorization":"NOT_GRANTED"}' > asen-acceptance-evidence/real-review-verifier.json
      - name: Verify real provider grades and exact-SHA call receipts without inference
        shell: bash
        env:
          ASEN_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/t12-live-evidence-gate.mjs
      - name: F7 reconcile exact-SHA real evidence after strict gate (never FULL)
        env:
          ASEN_EXPECTED_SHA: ${{ github.sha }}
          ASEN_OFFLINE_TESTS_PASSED: '1'
          ASEN_INCLUDE_VALIDATED_LIVE_EVIDENCE: '1'
        run: node scripts/t12-acceptance-ledger.mjs
      - name: Real-provider acceptance deferred steps
        shell: bash
        run: |
          set -euo pipefail
          if test "$ASEN_MAX_INFERENCE_CALLS" = "5"; then
            printf '%s\n' 'PASS_BOUNDED_READ_ONLY: authenticated Explorer, Planner, two separate Reviewer judgments and Verifier were accepted by the exact-SHA evidence gate.' 'LIMITATION: both Reviewer judgments use the same selected provider and model; they are not independent external review.' 'BLOCKED_INTERACTIVE: Writer requires Pi one-time approval; no authorization was simulated.' 'DEFERRED: provider-backed restart, quota exhaustion and timeout recovery remain unverified.' > asen-acceptance-evidence/real-provider-status.txt
          else
            printf '%s\n' 'PARTIAL_CALL_BUDGET: authenticated Explorer and Planner passed the exact-SHA evidence gate; Reviewer and Verifier did not run.' 'BLOCKED_CALL_BUDGET: Reviewer and Verifier were not run; SKIPPED is not PASS.' 'BLOCKED_INTERACTIVE: Writer requires Pi one-time approval; no authorization was simulated.' 'DEFERRED: provider-backed restart, quota exhaustion and timeout recovery remain unverified.' > asen-acceptance-evidence/real-provider-status.txt
          fi
      - name: Inspect call receipts without spending another inference request
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d "$RUNNER_TEMP/asen-inference-budget"; then
            node scripts/t12-inference-budget.mjs --report > asen-acceptance-evidence/inference-budget-summary.json
          fi
      - name: Preserve provider evidence without exporting secrets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d "$RUNNER_TEMP/asen-inference-budget"; then
            cp -R "$RUNNER_TEMP/asen-inference-budget" asen-acceptance-evidence/inference-budget
          fi
      - name: Upload provider evidence without exporting secrets
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-real-provider-${{ github.sha }}-${{ github.run_id }}
          path: asen-acceptance-evidence/
          if-no-files-found: warn
          retention-days: 14

  blocked-writer:
    name: Writer authorization design lock
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record why Writer remains non-authoritative in CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p asen-acceptance-evidence
          printf '%s\n' 'Writer remains BLOCKED in automated CI.' '' 'Reason:' '- Worker execution requires a one-time interactive Pi UI authorization.' '- The one-use grant binds candidate, repository, revision, and exact file scope.' '- GitHub Actions cannot legitimately supply or simulate that consent.' '' 'Safe future enablement:' '1. Use a private daemon or service account only if Pi exposes an explicit non-interactive consent token contract.' '2. Bind that token to one candidate and one bounded file set.' '3. Consume it once.' '4. Run assertWriterAuthorizationSnapshotCurrent before execution and assertWriterAuthorizationSnapshotOutcome after.' > asen-acceptance-evidence/writer-blocked.md
      - name: Preserve blocked-writer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-writer-blocked-${{ github.sha }}-${{ github.run_id }}
          path: asen-acceptance-evidence/writer-blocked.md
          if-no-files-found: error
          retention-days: 30
