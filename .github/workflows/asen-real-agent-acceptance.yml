      github.ref == 'refs/heads/feat/t12-integrated-acceptance-merge' &&
      github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.head_commit.message == 'ci: one-time Ollama Cloud provider smoke'))
    name: Real Ollama Cloud functional acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: ollama-cloud-beam
    permissions:
      contents: read
    env:
      ASEN_PROVIDER: ollama-cloud
      ASEN_MODEL: beam:cloud
      ASEN_STRICT_INFERENCE_ORDER: '1'
      ASEN_MAX_INFERENCE_CALLS: ${{ inputs.max-inference-calls || '5' }}
      ASEN_OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - name: Verify bundled Pi runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          if test -f node_modules/.bin/pi; then ./node_modules/.bin/pi --version; fi
      - name: Install pinned Ollama Cloud provider extension
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/asen-pi-home"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          mkdir -p "$PI_CODING_AGENT_DIR"
          test -n "$OLLAMA_API_KEY" || { echo "::error::OLLAMA_API_KEY missing"; exit 1; }
          node_modules/.bin/pi install npm:pi-ollama-cloud@0.13.1
          mkdir -p asen-acceptance-evidence
          node scripts/t12-pi-retry-settings.mjs > asen-acceptance-evidence/pi-retry-settings.json
          PI_OLLAMA_WEB_TOOLS=0 node_modules/.bin/pi --list-models > "$RUNNER_TEMP/asen-ollama-models.txt"
          mkdir -p asen-acceptance-evidence
          # Pi lists provider and model in columns. Capture only IDs; never persist credentials.
          awk '$1 == "ollama-cloud" {print $2}' "$RUNNER_TEMP/asen-ollama-models.txt" > asen-acceptance-evidence/registered-model-ids.txt
          if ! test -s asen-acceptance-evidence/registered-model-ids.txt; then
            echo "::error::No Ollama Cloud models registered; inspect provider load, credential and catalog refresh"
            exit 1
          fi
          if grep -Fxq "$ASEN_MODEL" asen-acceptance-evidence/registered-model-ids.txt; then
            selected="$ASEN_MODEL"
          elif grep -Fxq "beam" asen-acceptance-evidence/registered-model-ids.txt; then
            # The pinned cloud provider currently advertises this canonical Beam ID.
            selected="beam"
            echo "::notice::Using registered Beam alias; no unrelated model fallback permitted"
          else
            echo "::error::Neither the pinned Beam model nor its registered alias is available; refusing any model inference"
            exit 1
          fi
          printf '%s\n' "$selected" > "$RUNNER_TEMP/asen-selected-model"
          echo "Selected one Ollama Cloud model from live Pi registration"
      - name: Bounded Ollama Cloud provider smoke
        shell: bash
        run: |
          set -euo pipefail
          if test "$ASEN_MAX_INFERENCE_CALLS" != "3"; then
            echo "Skipping standalone smoke so the five-call budget covers Explorer, Planner, two blind reviewers and Verifier."
            exit 0
          fi
          test -n "${ASEN_OLLAMA_API_KEY}" || { echo "::error::OLLAMA_API_KEY is not configured"; exit 1; }
          if ! test -f node_modules/.bin/pi; then echo "::error::No Pi runtime is available in the installed dependencies"; exit 1; fi
          node scripts/t12-inference-budget.mjs provider-connectivity
          export HOME="$RUNNER_TEMP/asen-pi-home"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          export PI_OLLAMA_WEB_TOOLS=0
