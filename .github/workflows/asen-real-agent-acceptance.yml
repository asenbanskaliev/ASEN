name: ASEN real-agent functional acceptance

# Bounded opt-in verifies direct provider and genuine read-only Dispatcher; no lifecycle bypass or Writer grant.
# To exercise the native parent lane, change this workflow in the same commit whose exact
# message is 'ci: one-time Pi parent Beam proof'. A docs-only commit does not match paths.
on:
  push:
    branches:
      - feat/t12-integrated-acceptance-merge
    paths:
      - .github/workflows/asen-real-agent-acceptance.yml
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - .github/workflows/**
      - extensions/**
      - src/**
      - scripts/t12-*.mjs
      - scripts/t12-*.ts
      - scripts/t12-parent-probe.ts
      - scripts/t12-parent-real-child-probe.ts
      - scripts/agent-ab-*.mjs
      - scripts/agent-observable-*.mjs
      - registry/parity/agent-ab-baselines-v1.json
      - registry/parity/agent-ab-case-readiness-v1.json
      - tests/**
  workflow_dispatch:
    inputs:
      os:
        description: Hosted runner for the Beam/Ollama acceptance lane
        required: true
        type: choice
        options:
          - ubuntu-24.04
      max-inference-calls:
        description: Documented upper bound for provider calls made by this run
        required: true
        type: choice
        options:
          - "3"
          - "5"
permissions:
  contents: read
concurrency:
  group: asen-real-agent-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-static-validation:
    if: github.repository == 'asenbanskaliev/ASEN'
    name: Provider-free static and ASEN validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse 'HEAD^{commit}')"
          mkdir -p asen-acceptance-evidence
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - name: Syntax-check provider entrypoints before any authenticated execution
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/t12-real-child-parent-consumption.mjs
          node --check scripts/t12-real-parent-consumption.mjs
          node --check scripts/t12-real-child-parent-grade.mjs
          node --check scripts/t12-revalidation-contract.mjs
          node --check scripts/t12-real-repair-revalidation.mjs
          node --check scripts/t12-real-stream-interruption.mjs
          node --check scripts/t12-real-tui-stream-crash.mjs
          node --check scripts/t12-stream-interruption-reopen.mjs
          node --check scripts/t12-stream-interruption-grade.mjs
          node --check scripts/t12-real-ef603-coalescing.mjs
          node --check scripts/t12-ef603-coalescing-grade.mjs
          node --check scripts/t12-parent-consumption-grade.mjs
          node --check scripts/agent-ab-manifest-reader.mjs
          node --check scripts/agent-observable-receipts.mjs
          node --check scripts/agent-observable-parity.mjs
          node --check scripts/t12-native-tui-crash-recovery.mjs
          node --check scripts/t12-native-tui-crash-grade.mjs
          node --check scripts/agent-ab-case-readiness.mjs
          node --check scripts/agent-ab-host-smoke.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: F7 audit EF checklist and check its negative regression tests
        run: npm run audit:ef-plan && node --import tsx --test tests/audit-ef-plan.test.ts
      - name: Focused profile, routing, reviewer, verifier and authorization tests
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            tests/profile-selection.test.ts \
            tests/profile-routing-real.test.ts \
            tests/orchestrator.test.ts \
            tests/functional-role-parity-matrix.test.ts \
            tests/agent-observable-parity.test.ts \
            tests/agent-ab-triple-cli-security.test.ts \
            tests/agent-observable-scaffold.test.ts \
            tests/agent-observable-receipts.test.ts \
            tests/agent-ab-source-witness.test.ts \
            tests/agent-ab-case-readiness.test.ts \
            tests/agent-ab-host-smoke.test.ts \
            tests/frozen-ecosystem-source.test.ts \
            tests/natural-plan-tool.test.ts \
            tests/orchestrator-dispatcher-integration.test.ts \
            tests/agent-terminal-delivery.test.ts \
            tests/explorer-budget.test.ts \
            tests/session-notifications.test.ts \
            tests/notification-projection.test.ts \
            tests/plan-dispatcher-role-boundaries.test.ts \
            tests/review-acceptance.test.ts \
            tests/plan-dispatcher-candidate-guard.test.ts \
            tests/executable-plan-candidate-propagation.test.ts \
            tests/task-agent-coordinator.test.ts \
            tests/task-agent-automation.test.ts \
            tests/pi-verifier-exit.test.ts \
            tests/pi-model-reviewer.test.ts \
            tests/writer-authorization-snapshot.test.ts \
            tests/permission-modes.test.ts \
            tests/ef001-confirmation-regressions.test.ts \
            tests/auto-permission-reviewer.test.ts \
            tests/auto-permission-evidence.test.ts \
            tests/yolo-temp-scratch.test.ts
      - name: F6 interruption, restart, authorization and provider failure regressions
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            tests/agent-store.test.ts \
            tests/agent-coalesce-multiprocess.test.ts \
            tests/agent-coalesce-role-scope.test.ts \
            tests/planned-explorer-multiprocess.test.ts \
            tests/trusted-task-agent-binder.test.ts \
            tests/task-agent-coordinator-links.test.ts \
            tests/task-agent-automation.test.ts \
            tests/task-agent-recovery-chain.test.ts \
            tests/odd-task-tracking.test.ts \
            tests/authorized-write-recovery.test.ts \
            tests/eco06-interrupted-writer.test.ts \
            tests/eco07-provider-failure.test.ts \
            tests/background-job-journal.test.ts \
            tests/agent-notification-multiprocess.test.ts \
            tests/agent-notification-restart-process.test.ts \
            tests/agent-notice-ack-tool.test.ts \
            tests/agent-rpc-tui-handoff.test.ts \
            tests/agent-notification-journal.test.ts \
            tests/agent-terminal-routing-journal.test.ts \
            tests/managed-acquisition-copy.test.ts \
            tests/pi-process-runner.test.ts \
            tests/pi-session-recovery-e2e.test.ts \
            tests/ef604-native-pi-headless-restart.test.ts \
            tests/t12-stream-interruption-reopen.test.ts \
            tests/session-recovery-e2e.test.ts
      - name: EF-604 real native Pi TUI parent hard death and live Pi RPC subprocess recovery (no model)
        shell: bash
        env:
          ASEN_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          timeout 110s node scripts/t12-native-tui-crash-recovery.mjs
          node -e 'const x=require("./asen-acceptance-evidence/native-tui-crash-recovery.json");if(x.candidateSha!==process.env.ASEN_EXPECTED_SHA||x.status!=="PASS_NATIVE_TUI_PARENT_CRASH_WITH_ACTIVE_PI_RPC_CHILD"||x.providerCalls!==0||x.replayedCalls!==0||x.writerAuthorized!==false||x.globalFull!==false)process.exit(1);'
      - name: F6 cross-process inference recovery, corruption and negative checks
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/t12-inference-budget.test.ts
      - name: F2/F3 deterministic fixture and planning contracts
        shell: bash
        run: node --import tsx --test tests/t12-real-agent-fixture.test.ts tests/t12-plan-grader.test.ts tests/t12-review-grader.test.ts tests/t12-verifier-brief.test.ts tests/t12-parent-consumption-grade.test.ts tests/t12-real-child-parent-grade.test.ts tests/t12-real-busy-parent-grade.test.ts tests/t12-real-provider-workflow.test.ts tests/t12-provider-failure.test.ts tests/t12-stream-interruption-grade.test.ts tests/t12-stream-interruption-workflow.test.ts tests/t12-real-tui-stream-crash-workflow.test.ts tests/t12-ef603-coalescing-grade.test.ts tests/t12-ef603-coalescing-workflow.test.ts tests/t12-native-tui-crash-grade.test.ts tests/t12-native-tui-crash-workflow.test.ts tests/t12-disposable-correction.test.ts tests/t12-revalidation-contract.test.ts tests/agent-ab-manifest-reader.test.ts tests/agent-ab-combined-gate.test.ts tests/t12-live-evidence-gate.test.ts tests/t12-explorer-schema.test.ts tests/t12-acceptance-ledger.test.ts
      - name: Ollama scoped child credential regression
        run: node --import tsx --test tests/t12-ollama-child-credential.test.ts
      - name: Pi retry settings preserve installed extensions
        run: node --import tsx --test tests/t12-pi-retry-settings.test.ts
      - name: F1/F2/F6 Pi runtime event, budget and duplicate-start regression (mock runner)
        run: node --import tsx --test --test-name-pattern='EF-201|EF-601|EF-603|EF-202|EF-604' tests/pi-agent-runtime.test.ts
      - name: F7 create exact-SHA provider-free acceptance ledger (never claim FULL)
        env:
          ASEN_OFFLINE_TESTS_PASSED: '1'
          ASEN_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/t12-acceptance-ledger.mjs
      - name: EF-701 cross-audit all C01-C20 A/B/ASEN evidence slots (not live attestation)
        env:
          ASEN_EXPECTED_SHA: ${{ github.sha }}
          ASEN_AB_COMBINED_OUTPUT: ${{ github.workspace }}/asen-acceptance-evidence/ab-combined.json
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          node --check scripts/agent-ab-combined-gate.mjs
          node scripts/agent-ab-combined-gate.mjs
          node -e 'const x=require("./asen-acceptance-evidence/ab-combined.json"); if(x.totalCases!==20||x.expectedSlots!==60||x.casesBlocked!==20||x.sourceCasesExecutedAndAttested!==0||x.integrityOnly!==0||x.globalFull!==false||x.writerAuthorized!==false)process.exit(1);'
      - name: Validate repository diff hygiene
        run: git diff --check
      - name: Preserve provider-free validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-acceptance-offline-${{ github.sha }}-${{ github.run_id }}
          path: asen-acceptance-evidence/
          if-no-files-found: warn
          retention-days: 14


  ab-frozen-source-witness:
    needs: offline-static-validation
    if: github.repository == 'asenbanskaliev/ASEN'
    name: Frozen A/B source objects (source-only, not real C01-C20)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - name: Verify exact upstream A and B Git objects without running either upstream
        shell: bash
        env:
          ASEN_AB_WITNESS_OUTPUT: ${{ github.workspace }}/asen-acceptance-evidence/ab-source-witness.json
          ASEN_AB_CASE_READINESS_OUTPUT: ${{ github.workspace }}/asen-acceptance-evidence/ab-case-readiness.json
          ASEN_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p asen-acceptance-evidence
          node scripts/agent-ab-source-witness.mjs
          node scripts/agent-ab-case-readiness.mjs
          node -e 'const w=require("./asen-acceptance-evidence/ab-source-witness.json"),r=require("./asen-acceptance-evidence/ab-case-readiness.json"); if(w.checkedSources!==2||w.executedCases!==0||w.globalFull!==false||w.runtimeAttested!==false||w.identicalHostRuntime!==false||w.referenceBRequiresProvisionedTarget!==true||w.sources[0].runtimeSurface!=="native-pi-agent-runtime"||w.sources[1].runtimeSurface!=="installer-and-agent-framework"||r.casesPrepared!==20||r.sourceSlotsRequired!==60||r.evidenceCaptured!==0||r.globalFull!==false)process.exit(1);'
      - name: Preserve only source provenance (no fabricated behavioral capture)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-ab-source-only-${{ github.sha }}-${{ github.run_id }}
          path: |
            asen-acceptance-evidence/ab-source-witness.json
            asen-acceptance-evidence/ab-case-readiness.json
          if-no-files-found: warn
          retention-days: 14

  ab-native-host-smoke:
    needs: [offline-static-validation, ab-frozen-source-witness]
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.ref == 'refs/heads/feat/t12-integrated-acceptance-merge' &&
      github.run_attempt == 1 &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ci: one-time A/B native host smoke'
    name: Native A/B pinned CLI help — no C01-C20 claims
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"
          cache: false
      - name: Execute frozen A Pi launcher help and B Go binary help, never install
        shell: bash
        env:
          ASEN_AB_HOST_SMOKE_OUTPUT: ${{ github.workspace }}/asen-acceptance-evidence/ab-native-host-smoke.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p asen-acceptance-evidence
          timeout 740s node scripts/agent-ab-host-smoke.mjs
          node -e 'const r=require("./asen-acceptance-evidence/ab-native-host-smoke.json"); if(r.status!=="REFERENCE_HOST_HELP_ONLY"||r.hosts?.length!==2||r.executedCases!==0||r.modelCalls!==0||r.fullParity!==false||r.referenceBProvisioned!==false)process.exit(1);'
      - name: Preserve native executable entrypoint receipt only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-ab-native-host-${{ github.sha }}-${{ github.run_id }}
          path: asen-acceptance-evidence/ab-native-host-smoke.json
          if-no-files-found: warn
          retention-days: 14

  real-parent-consumption:
    needs: offline-static-validation
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.ref == 'refs/heads/feat/t12-integrated-acceptance-merge' &&
      github.run_attempt == 1 &&
      github.event_name == 'push' &&
      (github.event.head_commit.message == 'ci: one-time Pi parent Beam proof' ||
      github.event.head_commit.message == 'ci: one-time Pi parent-child Beam proof' ||
      github.event.head_commit.message == 'ci: one-time Pi busy-parent Beam proof')
    name: Real Pi parent notices with Beam (fixture or real RPC child)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: ollama-cloud-beam
    permissions:
      contents: read
    env:
      ASEN_EXPECTED_SHA: ${{ github.sha }}
      ASEN_OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      PI_OLLAMA_WEB_TOOLS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - name: Install pinned Beam provider into isolated Pi home
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/asen-pi-parent"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          mkdir -p "$PI_CODING_AGENT_DIR"
          test -n "$ASEN_OLLAMA_API_KEY" || { echo "::error::Ollama Cloud authentication missing"; exit 1; }
          OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY" node_modules/.bin/pi install npm:pi-ollama-cloud@0.13.1
          OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY" PI_OLLAMA_WEB_TOOLS=0 node_modules/.bin/pi --list-models > "$RUNNER_TEMP/asen-parent-models.txt"
          awk '$1 == "ollama-cloud" {print $2}' "$RUNNER_TEMP/asen-parent-models.txt" > "$RUNNER_TEMP/asen-parent-model-ids.txt"
          if grep -Fxq "beam:cloud" "$RUNNER_TEMP/asen-parent-model-ids.txt"; then
            selected="beam:cloud"
          elif grep -Fxq "beam" "$RUNNER_TEMP/asen-parent-model-ids.txt"; then
            selected="beam"
          else
            echo "::error::No pinned Beam alias available"; exit 1
          fi
          printf '%s\n' "$selected" > "$RUNNER_TEMP/asen-parent-selected-model"
          echo "Native Pi parent selected one registered Beam model; no paid fallback"
      - name: Native Pi parent and optional real Pi RPC child — isolated, bounded Beam
        shell: bash
        env:
          ASEN_ACCEPTANCE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/asen-pi-parent"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          ASEN_SELECTED_MODEL="$(cat "$RUNNER_TEMP/asen-parent-selected-model")"
          export ASEN_SELECTED_MODEL
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          mkdir -p asen-acceptance-evidence
          if test "$ASEN_ACCEPTANCE_COMMIT_MESSAGE" = "ci: one-time Pi busy-parent Beam proof"; then
            ASEN_PARENT_WITNESS_MODE=busy timeout 250s node scripts/t12-real-child-parent-consumption.mjs
          elif test "$ASEN_ACCEPTANCE_COMMIT_MESSAGE" = "ci: one-time Pi parent-child Beam proof"; then
            timeout 250s node scripts/t12-real-child-parent-consumption.mjs
          elif test "$ASEN_ACCEPTANCE_COMMIT_MESSAGE" = "ci: one-time Pi parent Beam proof"; then
            timeout 160s node scripts/t12-real-parent-consumption.mjs
          else
            echo "::error::Unrecognized one-time Pi acceptance trigger"; exit 1
          fi
      - name: Preserve source-bound real Pi parent receipt, or explicit absence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-parent-real-${{ github.sha }}-${{ github.run_id }}
          path: |
            asen-acceptance-evidence/real-pi-parent-wake.json
            asen-acceptance-evidence/real-pi-parent-child-wake.json
            asen-acceptance-evidence/real-pi-parent-child-busy.json
          if-no-files-found: warn
          retention-days: 14

  real-tui-stream-crash:
    needs: offline-static-validation
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.ref == 'refs/heads/feat/t12-integrated-acceptance-merge' &&
      github.run_attempt == 1 &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ci: one-time Pi Beam TUI child crash proof'
    name: EF-604 real Pi TUI crash during Beam child inference
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: ollama-cloud-beam
    permissions:
      contents: read
    env:
      ASEN_EXPECTED_SHA: ${{ github.sha }}
      ASEN_OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      PI_OLLAMA_WEB_TOOLS: '0'
      ASEN_MAX_AGENTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - name: Select only the pinned free Beam model in isolated Pi home
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/asen-live-tui-pi"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          mkdir -p "$PI_CODING_AGENT_DIR"
          test -n "$ASEN_OLLAMA_API_KEY" || { echo "::error::Isolated Ollama key unavailable"; exit 1; }
          OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY" node_modules/.bin/pi install npm:pi-ollama-cloud@0.13.1
          OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY" PI_OLLAMA_WEB_TOOLS=0 node_modules/.bin/pi --list-models > "$RUNNER_TEMP/asen-live-tui-models.txt"
          awk '$1 == "ollama-cloud" {print $2}' "$RUNNER_TEMP/asen-live-tui-models.txt" > "$RUNNER_TEMP/asen-live-tui-model-ids.txt"
          if grep -Fxq "beam:cloud" "$RUNNER_TEMP/asen-live-tui-model-ids.txt"; then
            selected="beam:cloud"
          elif grep -Fxq "beam" "$RUNNER_TEMP/asen-live-tui-model-ids.txt"; then
            selected="beam"
          else
            echo "::error::No Beam model, no provider fallback"; exit 1
          fi
          printf '%s\n' "$selected" > "$RUNNER_TEMP/asen-live-tui-selected-model"
      - name: Kill the real Pi TUI only after its ASEN Explorer streams a native Beam text delta
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/asen-live-tui-pi"
          export USERPROFILE="$HOME"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          export OLLAMA_API_KEY="$ASEN_OLLAMA_API_KEY"
          export ASEN_SELECTED_MODEL="$(cat "$RUNNER_TEMP/asen-live-tui-selected-model")"
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          mkdir -p asen-acceptance-evidence
          timeout 220s node --import tsx scripts/t12-real-tui-stream-crash.mjs
      - name: Preserve exact-SHA bounded evidence without model transcript
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-real-pi-tui-stream-crash-${{ github.sha }}-${{ github.run_id }}
          path: asen-acceptance-evidence/real-pi-tui-stream-crash.json
          if-no-files-found: warn
          retention-days: 14

  real-stream-interruption:
    needs: offline-static-validation
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.ref == 'refs/heads/feat/t12-integrated-acceptance-merge' &&
      github.run_attempt == 1 &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ci: one-time Pi streamed-child interruption Beam proof'
