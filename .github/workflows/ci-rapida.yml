name: CI rápida
# Pruebas inmediatas de cada cambio, sin proveedores de pago ni reintentos.
# Las pruebas completas de los tres sistemas solo se lanzan al cerrar la tanda.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-rapida-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - name: Comprobar identidad exacta antes de las pruebas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
      - name: Instalar dependencias sin ejecutar scripts externos
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Comprobar tipos sin modelos externos
        run: npm run typecheck
      - name: Comprobar las reglas de cierre y las pruebas acotadas
        run: |
          node --import tsx --test \
            tests/ci-por-tandas.test.ts \
            tests/ci-shard-receipts.test.ts \
            tests/ci-specialized-gates.test.ts \
            tests/t06-github-workflow-boundary.test.ts \
            tests/t06-auto-review-authority.test.ts \
            tests/t06-verified-review-reuse.test.ts \
            tests/t06-aislamiento-modelos-nvidia.test.mjs
      - name: Verificar aislamiento del proyecto original
        run: npm run audit:upstream-boundary
