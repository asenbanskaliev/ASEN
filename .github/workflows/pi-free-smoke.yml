name: Pi Free Smoke
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  anonymous-free-model:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Pi and pi-free
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.87.1
          pi install npm:pi-free
      - name: Inspect pi-free registered models
        run: pi --list-models
      - name: Anonymous free-model smoke
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pi --list-models | tee "$RUNNER_TEMP/models.txt"
          MODEL_LINE="$(grep -Ei 'llm7|free' "$RUNNER_TEMP/models.txt" | head -n 1 || true)"
          test -n "$MODEL_LINE"
          echo "Detected: $MODEL_LINE"
