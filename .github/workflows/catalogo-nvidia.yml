name: Consultar catálogo NVIDIA sin generación
# Solo una ejecución manual; jamás se inicia desde PR, push o calendario.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'SHA exacto de la rama feat/flujo-de-agentes-20261115'
        type: string
        required: true
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true
    secrets:
      NVIDIA_API_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: asen-catalogo-nvidia-${{ github.ref }}
  cancel-in-progress: false
jobs:
  catalogo-sin-generacion:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'asenbanskaliev' &&
      github.ref == 'refs/heads/feat/flujo-de-agentes-20261115' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Obtener SHA exacto sin persistir credenciales
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: '24'
      - name: Confirmar identidad, SHA y pruebas sin acceder a NVIDIA
        shell: bash
        env:
          ASEN_NVIDIA_EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$ASEN_NVIDIA_EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$ASEN_NVIDIA_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$ASEN_NVIDIA_EXPECTED_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${NVIDIA_API_KEY:-}"
          node --test tests/catalogo-nvidia.test.mjs
      - name: Consultar SOLO lista de modelos disponibles con clave NVIDIA
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ASEN_NVIDIA_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          ASEN_NVIDIA_SOLO_CATALOGO: '1'
          ASEN_NVIDIA_CATALOGO_REPORT_PATH: ${{ runner.temp }}/asen-catalogo-nvidia/catalogo-nvidia.json
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$ASEN_NVIDIA_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$ASEN_NVIDIA_EXPECTED_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          node scripts/catalogo-nvidia.mjs
      - name: Guardar nombres exactos, sin respuestas ni secretos
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-catalogo-nvidia-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-catalogo-nvidia/catalogo-nvidia.json
          if-no-files-found: warn
          retention-days: 7
