name: T08 dos jueces y reparación NVIDIA aislada
# Una sola autorización del dueño, sin aprobaciones de entorno ni permisos Git de escritura.
# La etapa de reparación no empieza si la revisión inicial no está acreditada.
on:
  push:
    branches:
      - feat/flujo-de-agentes-20261115
    paths:
      - .github/workflows/asen-t08-auto-aislado.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: asen-t08-auto-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparar:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'push' &&
      github.actor == 'asenbanskaliev' &&
      github.ref == 'refs/heads/feat/flujo-de-agentes-20261115' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci(asen): ejecutar T08 NVIDIA sin aprobaciones'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: &contexto
      ASEN_T08_OWNER_AUTO: "1"
      ASEN_DOCKER_TESTS_CI: "1"
      ASEN_T08_COST_ACK: "true"
      ASEN_T08_EXPECTED_SHA: ${{ github.sha }}
      ASEN_T08_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      ASEN_T08_REVIEW_A: nvidia/nemotron-3.5-bolt-e4b
      ASEN_T08_REVIEW_B: nvidia/nemotron-3.5-super-vl-120b-a12b
      ASEN_T08_WRITER_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
      - name: Probar seguridad, código, contextos negativos y permisos sin proveedor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_T08_EXPECTED_SHA"
          test -z "$(printenv NVIDIA_API_KEY || true)"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npx --no-install tsc -p tsconfig.t08.json
          node --import tsx --test tests/t08-owner-auto-authorization.test.ts tests/t08-github-approvals.test.ts tests/t08-judge-admission.test.ts tests/t08-isolated-repository.test.ts tests/t08-pi-review-text.test.ts
          node --import tsx --input-type=module -e "import {autorizarT08Auto} from './src/runtime/agents/t08-owner-auto-authorization.ts';if(!autorizarT08Auto())process.exit(1)"
          test -z "$(git status --porcelain=v1)"
  revisar:
    needs: [preparar]
    if: github.repository == 'asenbanskaliev/ASEN' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
      actions: read
    env: *contexto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
      - name: Instalar Pi sin reintentos y verificar contenedor
        shell: bash
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-t08-jueces-config
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.5.2
          test "$(pi --version | tr -d '\r')" = "1.5.2"
          mkdir -p "$PI_CODING_AGENT_DIR"
          node scripts/t12-pi-retry-settings.mjs
          docker pull node@sha256:a34ab6d7f6f4813f4d0c5469d74685604b962fbdbf5793a7bc7b4998ecb867c8
      - name: Ejecutar dos jueces Pi reales sin herramientas
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ASEN_T08_REPORT_DIR: ${{ runner.temp }}/asen-t08-original
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-t08-jueces-config
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_T08_EXPECTED_SHA"
          test -n "$NVIDIA_API_KEY"
          mkdir -p "$ASEN_T08_REPORT_DIR"
          timeout 650s node --import tsx scripts/t08-github-real-fix.ts review
      - name: Guardar juicio y propuesta, sin autorizar aún reparación
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-t08-propuesta-auto-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-t08-original/t08-first-review.json
          if-no-files-found: warn
          retention-days: 14
  reparar:
    needs: [revisar]
    if: github.repository == 'asenbanskaliev/ASEN' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env: *contexto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
      - name: Recuperar propuesta del mismo run y SHA
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v7.0.0
        with:
          name: asen-t08-propuesta-auto-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-t08-descarga
      - name: Preparar Pi y contenedor sin reintentos
        shell: bash
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-t08-fix-config
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.5.2
          test "$(pi --version | tr -d '\r')" = "1.5.2"
          mkdir -p "$PI_CODING_AGENT_DIR"
          node scripts/t12-pi-retry-settings.mjs
          docker pull node@sha256:a34ab6d7f6f4813f4d0c5469d74685604b962fbdbf5793a7bc7b4998ecb867c8
      - name: Reparación en repositorio aislado y doble verificación final
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ASEN_T08_SOURCE_REPORT: ${{ runner.temp }}/asen-t08-descarga/t08-first-review.json
          ASEN_T08_REPORT_DIR: ${{ runner.temp }}/asen-t08-final
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-t08-fix-config
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_T08_EXPECTED_SHA"
          test -n "$NVIDIA_API_KEY"
          mkdir -p "$ASEN_T08_REPORT_DIR"
          timeout 690s node --import tsx scripts/t08-github-real-fix.ts fix
      - name: Conservar resultado exacto sin aceptar ni fusionar
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-t08-resultado-auto-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-t08-final/t08-result.json
          if-no-files-found: warn
          retention-days: 14
