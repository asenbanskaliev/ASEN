name: Release Gate
on:
  pull_request:
  push:
    branches: [main, "release/**"]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run verify:pack
      - name: Install official Pi CLI
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.87.1
      - name: Real Pi package install smoke
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          export PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-agent"
          export PI_OFFLINE=1
          TARBALL="$(npm pack --silent)"
          pi install "$GITHUB_WORKSPACE/$TARBALL"
          pi list | tee "$RUNNER_TEMP/pi-list.txt"
          grep -qi asen "$RUNNER_TEMP/pi-list.txt"
          node "$GITHUB_WORKSPACE/scripts/pi-extension-e2e.mjs" "$PI_CODING_AGENT_DIR/npm/node_modules/asen/extensions/asen.ts"
      - name: Real Pi package install smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PI_CODING_AGENT_DIR = Join-Path $env:RUNNER_TEMP "pi-agent"
          $env:PI_OFFLINE = "1"
          $tarball = npm pack --silent
          pi install (Join-Path $env:GITHUB_WORKSPACE $tarball)
          $list = pi list | Out-String
          $list
          if ($list -notmatch "asen") { throw "ASEN not listed by real Pi" }
          node (Join-Path $env:GITHUB_WORKSPACE "scripts/pi-extension-e2e.mjs") (Join-Path $env:PI_CODING_AGENT_DIR "npm\node_modules\asen\extensions\asen.ts")
      - name: Packed install smoke
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          node -e 'const p=require("./node_modules/asen/package.json"); if (!p.pi?.extensions?.length) process.exit(1)'
      - name: Packed install smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tarball = npm pack --silent
          $tmp = Join-Path $env:RUNNER_TEMP "asen-packed"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Set-Location $tmp
          npm init -y | Out-Null
          npm install (Join-Path $env:GITHUB_WORKSPACE $tarball)
          node -e "const p=require('./node_modules/asen/package.json'); if (!p.pi?.extensions?.length) process.exit(1)"
