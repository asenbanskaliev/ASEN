name: Comprobar NVIDIA
# Diagnóstico MANUAL: sin ejecución por push, pull_request ni programación.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'SHA exacto de la rama feat/flujo-de-agentes-20261115'
        required: true
        type: string
      coste_desconocido_autorizado:
        description: 'Autorizo expresamente el posible coste de una petición corta por modelo'
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true
      coste_desconocido_autorizado:
        type: boolean
        required: true
    secrets:
      NVIDIA_API_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: asen-comprobar-nvidia-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comprobar-modelos:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'asenbanskaliev' &&
      github.ref == 'refs/heads/feat/flujo-de-agentes-20261115' &&
      github.run_attempt == 1 &&
      inputs.coste_desconocido_autorizado == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Obtener código de SHA exacto sin credenciales Git persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: '24'
      - name: Validar contexto y pruebas sin clave NVIDIA
        shell: bash
        env:
          ASEN_NVIDIA_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          ASEN_NVIDIA_COST_ACK: ${{ inputs.coste_desconocido_autorizado }}
        run: |
          set -euo pipefail
          [[ "$ASEN_NVIDIA_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$ASEN_NVIDIA_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$ASEN_NVIDIA_EXPECTED_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$ASEN_NVIDIA_COST_ACK" = true
          test -z "${NVIDIA_API_KEY:-}"
          node --test tests/comprobar-nvidia.test.mjs
      - name: Consultar catálogo y realizar un único intento breve por modelo
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ASEN_NVIDIA_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          ASEN_NVIDIA_COST_ACK: ${{ inputs.coste_desconocido_autorizado }}
          ASEN_NVIDIA_REPORT_PATH: ${{ runner.temp }}/asen-nvidia-diagnostico/resultado-nvidia.json
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$ASEN_NVIDIA_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$ASEN_NVIDIA_EXPECTED_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          node scripts/comprobar-nvidia.mjs
      - name: Conservar solo resultados técnicos sin claves ni respuestas
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-nvidia-diagnostico-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-nvidia-diagnostico/resultado-nvidia.json
          if-no-files-found: warn
          retention-days: 7
