name: Gemini PR40 controlled diagnostic
# Explicit manual trigger on default branch. No model calls in diagnostic phase.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnostic:
    if: github.repository == 'asenbanskaliev/ASEN' && github.actor == 'asenbanskaliev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate PR40 candidate and publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPO/pulls/40")"
          state="$(jq -r '.state' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr")"
          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          base_ref="$(jq -r '.base.ref' <<< "$pr")"
          sha="$(jq -r '.head.sha' <<< "$pr")"
          test "$state" = open
          test "$head_repo" = asenbanskaliev/ASEN
          test "$head_ref" = feat/t07-codegraph-completion
          test "$base_ref" = feat/strict-parity-prerequisites
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo '### Gemini T07 — diagnóstico de activación'
            echo
            echo "- GitHub Actions: activación manual correcta"
            echo "- PR: #40"
            echo "- Commit actual: \`$sha\`"
            echo "- Gemini API: todavía no utilizada"
            echo "- Revisión: pendiente de validación de permisos y autenticación"
          } > "$RUNNER_TEMP/gemini-diagnostic.md"
          gh api --method POST "repos/$REPO/issues/40/comments" --field "body=@$RUNNER_TEMP/gemini-diagnostic.md"
