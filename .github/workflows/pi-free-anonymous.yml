name: Pi Free Anonymous Validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  pi-free:
    if: github.event.pull_request.number == 30
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Pi and pi-free
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.87.1
          pi install npm:pi-free
      - name: Verify free provider registration
        run: pi --list-models
      - name: Execute anonymous LLM7 turn
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=""
          for attempt in 1 2 3; do
            if OUTPUT=$(pi --no-session --provider llm7 --model default --print "Reply with exactly ASEN_PI_FREE_OK"); then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q ASEN_PI_FREE_OK
