name: Megatanda NVIDIA de agentes Pi (lectura autorizada)
# No se activa por cambios en la PR. Reutilizable solo desde la entrada manual.
on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true
      cost_acknowledged:
        type: boolean
        required: true
    secrets:
      NVIDIA_API_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: asen-flujo-nvidia-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparar:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'asenbanskaliev' &&
      github.ref == 'refs/heads/feat/flujo-de-agentes-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Exigir decisión de coste, un solo intento y SHA exacto
        shell: bash
        env:
          SHA_ESPERADO: ${{ inputs.candidate_sha }}
          COSTE_AUTORIZADO: ${{ inputs.cost_acknowledged }}
        run: |
          set -euo pipefail
          [[ "$SHA_ESPERADO" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$SHA_ESPERADO"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$COSTE_AUTORIZADO" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: '24'
      - name: Preparar pruebas sin claves ni modelos
        shell: bash
        env:
          SHA_ESPERADO: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA_ESPERADO"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          node --import tsx --test tests/t06-pi-receipt-validator.test.ts tests/t06-read-only-git-fixture.test.ts tests/t06-github-workflow-boundary.test.ts
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
  probar-explorer-verifier:
    needs: [preparar]
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: '24'
      - name: Instalar Pi 1.2 sin ejecutar scripts externos
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.2.0
          test "$(pi --version | tr -d '\r')" = '1.2.0'
      - name: Preparar dependencias del SHA autorizado
        shell: bash
        env:
          SHA_ESPERADO: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA_ESPERADO"
          npm ci --ignore-scripts --no-audit --no-fund
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Comprobar Explorer y Verifier Pi reales sin herramientas ni escritura
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-flujo-pi
          ASEN_NVIDIA_PI_REPORT: ${{ runner.temp }}/asen-flujo-evidencias/resultado-pi.json
        run: |
          set -euo pipefail
          # Una repetición parcial omite preparar; no se permite gastar cuota de nuevo.
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -n "$NVIDIA_API_KEY"
          mkdir -p "$PI_CODING_AGENT_DIR" "$(dirname "$ASEN_NVIDIA_PI_REPORT")"
          timeout 250s node --import tsx scripts/t06-nvidia-pi-concurrent.ts
      - name: Conservar recibo limitado del SHA, sin claves ni texto de IA
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-flujo-nvidia-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/asen-flujo-evidencias/resultado-pi.json
          if-no-files-found: warn
          retention-days: 7
