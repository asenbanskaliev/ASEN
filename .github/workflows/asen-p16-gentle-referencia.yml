name: P16 comprobar referencia Gentle 4.9.0 para comparación real
on:
  push:
    branches:
      - feat/flujo-de-agentes-20261115
    paths:
      - .github/workflows/asen-p16-gentle-referencia.yml
      - scripts/p16-comprobar-referencia.mjs
      - tests/p16-comprobar-referencia.test.mjs
permissions:
  contents: read
jobs:
  contrastar-fuentes:
    if: github.repository == 'asenbanskaliev/ASEN' && github.ref == 'refs/heads/feat/flujo-de-agentes-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ASEN_P16_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          repository: Gentleman-Programming/gentle-shell
          ref: ce64a9a708e50c0ca899c8023140e63f29f293e1
          path: referencia-gentle-shell
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
      - name: Ejecutar pruebas negativas de referencia adulterada
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/p16-comprobar-referencia.test.mjs
      - name: Registrar fuentes y límites sin hacer llamadas NVIDIA
        shell: bash
        env:
          ASEN_P16_REPORT_DIR: ${{ runner.temp }}/asen-p16-evidencia
        run: |
          set -euo pipefail
          node scripts/p16-comprobar-referencia.mjs
      - name: Conservar diagnóstico verificable sin simular A/B
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-p16-fuentes-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-p16-evidencia/fuentes-p16.json
          if-no-files-found: warn
          retention-days: 30
