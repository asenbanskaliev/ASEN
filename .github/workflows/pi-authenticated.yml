name: ASEN Authenticated Pi Audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  authenticated-skill-turn:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Execute read-only Pi turn with exact ASEN Skills
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --import tsx scripts/pi-authenticated-skill-e2e.mjs
