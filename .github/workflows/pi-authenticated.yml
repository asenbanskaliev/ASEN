name: ASEN Authenticated Pi Audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  authenticated-skill-turn:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Pi and pi-free provider
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.87.1
          pi install npm:pi-free@2.8.1
      - name: Execute read-only Pi turn with exact ASEN Skills
        env:
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export ASEN_RECOVERY_FILE="$(mktemp)"
          export ASEN_RECOVERY_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          trap 'rm -f "$ASEN_RECOVERY_FILE"' EXIT
          node --import tsx scripts/pi-authenticated-recovery-init.mjs
          for attempt in 1 2 3; do
            if node --import tsx scripts/pi-authenticated-skill-e2e.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
