name: E1 decisiones naturales Pi NVIDIA

on:
  pull_request:
    types: [labeled]
    branches:
      - integration/megatanda-b-consolidada-20261124

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  ensayo-real:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/megatanda-estabilidad-autonomia-20261125' &&
      github.event.label.name == format('asen-e1-{0}', github.event.pull_request.head.sha) &&
      github.actor == 'asenbanskaliev' &&
      github.run_attempt == 1
    concurrency:
      group: e1-natural-pi-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirmar autorización exacta y ensayo único
        id: marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASEN_WORKFLOW_RUN: ${{ github.run_id }}
          ASEN_PR_NUMBER: ${{ github.event.pull_request.number }}
          ASEN_APPROVAL_LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          [[ "$ASEN_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$ASEN_APPROVAL_LABEL" = "asen-e1-$ASEN_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test "$(gh api "/repos/asenbanskaliev/ASEN/pulls/$ASEN_PR_NUMBER" --jq .head.sha)" = "$ASEN_EXPECTED_SHA"
          # Un intento previo no omitido impide consumir nuevamente el mismo SHA.
          previous=$(gh api --paginate "/repos/asenbanskaliev/ASEN/actions/workflows/e1-natural-pi.yml/runs?head_sha=$ASEN_EXPECTED_SHA&per_page=100" --jq ".workflow_runs[] | select(.id < $ASEN_WORKFLOW_RUN) | [.id,.status] | @tsv")
          while IFS=$'\t' read -r run status; do
            test -z "$run" && continue
            test "$status" = "completed" || { echo "Intento previo incierto"; exit 1; }
            count=$(gh api --paginate "/repos/asenbanskaliev/ASEN/actions/runs/$run/jobs?per_page=100" --jq '.jobs[] | select(.name == "ensayo-real") | .conclusion' | awk '$0 != "skipped" { n++ } END { print n+0 }')
            test "$count" = 0 || { echo "El intento anterior ya consumió la autorización"; exit 1; }
          done <<< "$previous"
          runs=$(gh api --paginate "/repos/asenbanskaliev/ASEN/actions/runs?head_sha=$ASEN_EXPECTED_SHA&event=pull_request&per_page=100" --jq '.workflow_runs[] | [.name,.status,.conclusion] | @tsv')
          for required in 'CI' 'Release Gate'; do
            printf '%s\n' "$runs" | awk -F '\t' -v name="$required" '$1==name && $2=="completed" && $3=="success" { ok=1 } END { exit !ok }'
          done
          echo "approved=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.marker.outputs.approved == 'true'
        with:
          node-version: "24"
      - name: Comprobar código y permiso de lote sin modelos
        id: preparation
        if: steps.marker.outputs.approved == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          node --check scripts/e1-natural-pi-nvidia.mjs
          node_modules/.bin/tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --skipLibCheck --types node scripts/e1-budget-explorer-nvidia.ts
          node --import tsx --test tests/e1-candidate-fallback-regression.test.ts tests/pi-agent-runtime.test.ts
          npm install -g --ignore-scripts tsx@4.23.15 @earendil-works/pi-coding-agent@1.2.0
          test "$(pi --version | tr -d '\r')" = "1.2.0"
      - name: Ejecutar tres decisiones naturales sin autorización Writer
        if: steps.marker.outputs.approved == 'true'
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ASEN_PR_NUMBER: ${{ github.event.pull_request.number }}
          ASEN_E1_REPORT: ${{ runner.temp }}/asen-e1-natural/receipt.json
          ASEN_E1_EXPLORER_REPORT: ${{ runner.temp }}/asen-e1-natural/explorer.json
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-e1-natural-pi
        run: |
          set -euo pipefail
          test "$(gh api "/repos/asenbanskaliev/ASEN/pulls/$ASEN_PR_NUMBER" --jq .head.sha)" = "$ASEN_EXPECTED_SHA"
          test "$(gh api "/repos/asenbanskaliev/ASEN/pulls/$ASEN_PR_NUMBER" --jq '.labels[].name' | grep -Fx "asen-e1-$ASEN_EXPECTED_SHA")" = "asen-e1-$ASEN_EXPECTED_SHA"
          unset GH_TOKEN
          test -n "$NVIDIA_API_KEY"
          mkdir -p "$PI_CODING_AGENT_DIR"
          node scripts/t12-pi-retry-settings.mjs
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          timeout 500s node scripts/e1-natural-pi-nvidia.mjs
      - name: Ejecutar Explorer aislado con presupuesto observado
        if: always() && !cancelled() && steps.marker.outputs.approved == 'true' && steps.preparation.conclusion == 'success'
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ASEN_PR_NUMBER: ${{ github.event.pull_request.number }}
          ASEN_E1_EXPLORER_REPORT: ${{ runner.temp }}/asen-e1-natural/explorer.json
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-e1-explorer-pi
        run: |
          set -euo pipefail
          test "$(gh api "/repos/asenbanskaliev/ASEN/pulls/$ASEN_PR_NUMBER" --jq .head.sha)" = "$ASEN_EXPECTED_SHA"
          test "$(gh api "/repos/asenbanskaliev/ASEN/pulls/$ASEN_PR_NUMBER" --jq '.labels[].name' | grep -Fx "asen-e1-$ASEN_EXPECTED_SHA")" = "asen-e1-$ASEN_EXPECTED_SHA"
          unset GH_TOKEN
          test -n "$NVIDIA_API_KEY"
          mkdir -p "$PI_CODING_AGENT_DIR"
          node scripts/t12-pi-retry-settings.mjs
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          timeout 450s tsx scripts/e1-budget-explorer-nvidia.ts
      - name: Guardar recibo sin credenciales ni datos del proveedor
        if: always() && steps.marker.outputs.approved == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: decisiones-naturales-nvidia-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-e1-natural/*.json
          if-no-files-found: warn
          retention-days: 30

# Ensayo E1 acotado: decisiones del padre, sin agentes hijos ni escrituras.
