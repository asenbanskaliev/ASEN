name: E2A lote ODD nativo real NVIDIA

on:
  pull_request:
    types: [labeled]
    branches:
      - integration/megatanda-1-3-20261123

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  ensayo-real:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.number == 115 &&
      github.event.pull_request.head.ref == 'integration/megatanda-b-consolidada-20261124' &&
      github.event.label.name == format('asen-e2a-{0}', github.event.pull_request.head.sha) &&
      github.actor == 'asenbanskaliev' &&
      github.run_attempt == 1
    concurrency:
      group: e2a-native-partition-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirmar autorización exacta y ensayo único
        id: marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASEN_WORKFLOW_RUN: ${{ github.run_id }}
          ASEN_PR_NUMBER: ${{ github.event.pull_request.number }}
          ASEN_APPROVAL_LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          [[ "$ASEN_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$ASEN_APPROVAL_LABEL" = "asen-e2a-$ASEN_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test "$(gh api "/repos/asenbanskaliev/ASEN/pulls/$ASEN_PR_NUMBER" --jq .head.sha)" = "$ASEN_EXPECTED_SHA"
          # Un intento previo no omitido impide consumir nuevamente el mismo SHA.
          previous=$(gh api --paginate "/repos/asenbanskaliev/ASEN/actions/workflows/e2a-native-partition-nvidia.yml/runs?head_sha=$ASEN_EXPECTED_SHA&per_page=100" --jq ".workflow_runs[] | select(.id < $ASEN_WORKFLOW_RUN) | [.id,.status] | @tsv")
          while IFS=$'\t' read -r run status; do
            test -z "$run" && continue
            test "$status" = "completed" || { echo "Intento previo incierto"; exit 1; }
            count=$(gh api --paginate "/repos/asenbanskaliev/ASEN/actions/runs/$run/jobs?per_page=100" --jq '.jobs[] | select(.name == "ensayo-real") | .conclusion' | awk '$0 != "skipped" { n++ } END { print n+0 }')
            test "$count" = 0 || { echo "El intento anterior ya consumió la autorización"; exit 1; }
          done <<< "$previous"
          # La etiqueta también puede iniciar CI/Release Gate: admitir solo el último
          # resultado del SHA exacto, esperar de forma acotada sin credenciales NVIDIA.
          node scripts/await-exact-validation.mjs 1500
          echo "approved=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.marker.outputs.approved == 'true'
        with:
          node-version: "24"
      - name: Comprobar código y permiso de lote sin modelos
        if: steps.marker.outputs.approved == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          node_modules/.bin/tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --skipLibCheck --types node scripts/e2a-native-partition-nvidia.ts
          node --import tsx --test tests/dispatcher.test.ts tests/odd-unit-partition.test.ts tests/parallel-worktree-command.test.ts tests/native-partition-flow.test.ts
          npm install -g --ignore-scripts tsx@4.23.15 @earendil-works/pi-coding-agent@1.2.0
          test "$(pi --version | tr -d '\r')" = "1.2.0"
      - name: Ejecutar el recorrido integral de dos Writers NVIDIA
        if: steps.marker.outputs.approved == 'true'
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ASEN_PR_NUMBER: ${{ github.event.pull_request.number }}
          ASEN_NATIVE_PARTITION_REPORT: ${{ runner.temp }}/asen-native-partition/receipt.json
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-native-partition-pi
        run: |
          set -euo pipefail
          test "$(gh api "/repos/asenbanskaliev/ASEN/pulls/$ASEN_PR_NUMBER" --jq .head.sha)" = "$ASEN_EXPECTED_SHA"
          test "$(gh api "/repos/asenbanskaliev/ASEN/pulls/$ASEN_PR_NUMBER" --jq '.labels[].name' | grep -Fx "asen-e2a-$ASEN_EXPECTED_SHA")" = "asen-e2a-$ASEN_EXPECTED_SHA"
          node scripts/await-exact-validation.mjs 0
          unset GH_TOKEN
          test -n "$NVIDIA_API_KEY"
          mkdir -p "$PI_CODING_AGENT_DIR"
          node scripts/t12-pi-retry-settings.mjs
          printf '%s\n' '{"remove":["read","edit"]}' > "$PI_CODING_AGENT_DIR/tools.json"
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          timeout 1000s tsx scripts/e2a-native-partition-nvidia.ts
      - name: Guardar recibo sin credenciales ni datos del proveedor
        if: always() && steps.marker.outputs.approved == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lote-nativo-nvidia-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-native-partition/*.json
          if-no-files-found: warn
          retention-days: 30

# Ensayo acotado: dos Writers reales y una sucesora con consentimiento separado; sin reintentos.
