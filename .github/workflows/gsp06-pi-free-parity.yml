name: GSP-06 Pi Free parity
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  gsp06-pi-free:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 32 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - run: npm install --ignore-scripts
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.0.0
      - run: pi install npm:pi-free
      - name: Exact candidate and deterministic gates
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          npm run typecheck
          npm run audit:skill-parity
          npm run verify:pack
      - name: Pi Free generated-output probes
        env:
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          ASEN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASEN_PI_PROVIDER: llm7
          ASEN_PI_MODEL: default
          ASEN_PI_PROVIDER_EXTENSION: npm:pi-free
        run: |
          test -n "$LLM7_API_KEY"
          node scripts/gsp06-pi-free-probes.mjs
