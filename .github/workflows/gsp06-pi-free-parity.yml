name: GSP-06 Pi Free parity
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact branch HEAD explicitly selected for a new provider run"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: gsp06-pi-free-${{ inputs.expected_sha }}
  cancel-in-progress: false
jobs:
  gsp06-pi-free:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/strict-parity-prerequisites' && inputs.expected_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - run: npm install --ignore-scripts
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.1.0
      - run: pi install npm:pi-free@2.8.4
      - name: Exact candidate and deterministic gates
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          npm run typecheck
          npm run audit:skill-parity
          npm run verify:pack
      - name: Reject stale or duplicate candidate before provider use
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: test "$(git ls-remote origin "refs/heads/$GH_REF_NAME" | cut -f1)" = "$EXPECTED_SHA"
      - name: Pi Free generated-output probes
        env:
          ASEN_EXPECTED_SHA: ${{ inputs.expected_sha }}
          ASEN_PI_PROVIDER: llm7
          ASEN_PI_MODEL: default
          ASEN_PI_PROVIDER_EXTENSION: npm:pi-free@2.8.4
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
        run: |
          test -n "$LLM7_API_KEY"
          node scripts/gsp06-pi-free-probes.mjs
      - name: Preserve ECO-05 real Pi model receipt
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: eco05-pi-model-${{ inputs.expected_sha }}
          path: registry/evidence/ecosystem/eco05-pi-model.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish ECO-05 model receipt without overwriting concurrent branch updates
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          test "$(git ls-remote origin "refs/heads/$GH_REF_NAME" | cut -f1)" = "$EXPECTED_SHA"
          git add registry/evidence/ecosystem/eco05-pi-model.json
          test "$(git diff --cached --name-only)" = "registry/evidence/ecosystem/eco05-pi-model.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(eco05): record authenticated Pi model evidence"
          git push origin "HEAD:refs/heads/$GH_REF_NAME"
