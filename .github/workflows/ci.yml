name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process');if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==process.env.ASEN_EXPECTED_SHA)process.exit(1)"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Prepare frozen ecosystem Git objects
        run: node .github/scripts/prepare-frozen-ecosystem-baseline.mjs
      # Same checks and order as npm run check, split into timed Actions steps.
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        env:
          ASEN_TEST_OVERALL_TIMEOUT_MS: ${{ matrix.os == 'windows-latest' && '2400000' || '1800000' }}
        run: npm test
      - name: macOS retained-source witness
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          set -o pipefail
          node .github/scripts/run-retained-ecosystem-source-witness.mjs 2>&1 | tee retained-source-witness.log
          witness_status=${PIPESTATUS[0]}
          printf '%s\n' "$witness_status" > retained-source-witness.exit
          exit "$witness_status"
      - name: Upload macOS retained-source witness
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retained-source-macos-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            retained-source-witness.log
            retained-source-witness.exit
          if-no-files-found: error
          retention-days: 14
      - name: Phase parity audit
        run: npm run audit:parity
      - name: Skills audit
        run: npm run audit:skills
      - name: Skill parity audit
        run: npm run audit:skill-parity
      - name: Memory parity audit
        run: npm run audit:memory-parity
      - name: Ecosystem audit
        run: npm run audit:ecosystem
      - name: Upstream boundary audit
        run: npm run audit:upstream-boundary
  architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process');if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==process.env.ASEN_EXPECTED_SHA)process.exit(1)"
      - name: Enforce ASEN upstream isolation boundary
        shell: bash
        run: node scripts/audit-upstream-boundary.mjs
  pi-support-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Semantic evidence admission gate
        run: node --import tsx --test tests/pi-support-matrix.test.ts tests/ecosystem-execution-receipts.test.ts tests/ecosystem-claims.test.ts tests/ecosystem-evidence-bundle.test.ts tests/pi-matrix-pty-helper.test.ts tests/pi-verifier-exit.test.ts tests/pi-matrix-cleanup.test.ts tests/ecosystem-package-receipts.test.ts
      - name: Pack exact candidate
        shell: bash
        run: npm pack --silent > matrix-package.txt
      - name: Run eight real Pi host cells
        shell: bash
        run: npm run verify:pi-matrix -- "$(cat matrix-package.txt)" matrix-evidence
      - name: Record executed contract and host evidence
        run: node scripts/ecosystem-execution-receipts.mjs contract-evidence matrix-evidence
      - name: Upload exact candidate matrix and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pi-support-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            matrix-evidence
            contract-evidence
          if-no-files-found: error
          retention-days: 14
  t05-r4-audit:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/t05-independent-review' &&
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      ASEN_T05_BASE_SHA: 18e98728e2e39c8b1a4ebf66019574ee7d1b32a6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: R4 exact-candidate and scope integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/feat/t05-independent-review | cut -f1)" = "$ASEN_EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git merge-base --is-ancestor "$ASEN_T05_BASE_SHA" "$ASEN_EXPECTED_SHA"
          git diff --check "$ASEN_T05_BASE_SHA" "$ASEN_EXPECTED_SHA"
          git diff --name-status "$ASEN_T05_BASE_SHA" "$ASEN_EXPECTED_SHA" > r4-changed-files.txt
          test -s r4-changed-files.txt
          sha256sum r4-changed-files.txt > r4-changed-files.sha256
      - name: R4 static security and architecture audits
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run audit:upstream-boundary
          npm run audit:skills
          npm run audit:skill-parity
      - name: R4 real Git and process regression scenarios
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/ordinary-review-workspace-flow.test.ts tests/background-job-journal.test.ts tests/workspace-writer-lease.test.ts tests/authorized-job-retry.test.ts 2>&1 | tee r4-scenarios.log
      - name: Real Pi 1.2.0 NVIDIA authorized ASEN workspace write
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-t05-pi-config
          ASEN_T05_EVIDENCE_DIR: ${{ github.workspace }}/r4-provider-evidence
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY" || { echo "::error::NVIDIA_API_KEY missing; authorized Pi provider task is BLOCKED"; exit 1; }
          mkdir -p "$PI_CODING_AGENT_DIR" "$ASEN_T05_EVIDENCE_DIR"
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.2.0
          timeout 180s node --import tsx scripts/t05-nvidia-live-write.ts
      - name: Preserve real execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t05-r4-execution-${{ github.event.pull_request.head.sha }}
          path: |
            r4-scenarios.log
            r4-provider-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve R4 audit scope evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t05-r4-scope-${{ github.event.pull_request.head.sha }}
          path: |
            r4-changed-files.txt
            r4-changed-files.sha256
          if-no-files-found: warn
          retention-days: 30
