name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process');if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==process.env.ASEN_EXPECTED_SHA)process.exit(1)"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Prepare frozen ecosystem Git objects
        run: node .github/scripts/prepare-frozen-ecosystem-baseline.mjs
      # Same checks and order as npm run check, split into timed Actions steps.
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        env:
          ASEN_TEST_OVERALL_TIMEOUT_MS: ${{ matrix.os == 'windows-latest' && '2400000' || '1800000' }}
        run: npm test
      - name: macOS retained-source witness
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          set -o pipefail
          node .github/scripts/run-retained-ecosystem-source-witness.mjs 2>&1 | tee retained-source-witness.log
          witness_status=${PIPESTATUS[0]}
          printf '%s\n' "$witness_status" > retained-source-witness.exit
          exit "$witness_status"
      - name: Upload macOS retained-source witness
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retained-source-macos-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            retained-source-witness.log
            retained-source-witness.exit
          if-no-files-found: error
          retention-days: 14
      - name: Phase parity audit
        run: npm run audit:parity
      - name: Skills audit
        run: npm run audit:skills
      - name: Skill parity audit
        run: npm run audit:skill-parity
      - name: Memory parity audit
        run: npm run audit:memory-parity
      - name: Ecosystem audit
        run: npm run audit:ecosystem
      - name: Upstream boundary audit
        run: npm run audit:upstream-boundary
  t07-real-codegraph:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/t07-codegraph-completion' &&
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Genuine CodeGraph CLI lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/t07-codegraph"
          cd "${RUNNER_TEMP}/t07-codegraph"
          git init -q
          git config user.email "probe@example.invalid"
          git config user.name "T07 Probe"
          printf 'export function calculateTotal(a,b) { return a+b; }\\n' > sample.js
          git add sample.js
          git commit -qm initial
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact @colbymchenry/codegraph
          node -p "require('./node_modules/@colbymchenry/codegraph/package.json').version"
          ./node_modules/.bin/codegraph --help
          ./node_modules/.bin/codegraph init --help
          ./node_modules/.bin/codegraph query --help
          ./node_modules/.bin/codegraph explore --help
          ./node_modules/.bin/codegraph init .
          ./node_modules/.bin/codegraph query --limit 10 -- calculateTotal
          ./node_modules/.bin/codegraph explore -- calculateTotal
          printf 'export function changedSymbol() { return 42; }\\n' > sample.js
          git add sample.js
          git commit -qm changed
          ./node_modules/.bin/codegraph sync
          ./node_modules/.bin/codegraph query --limit 10 -- changedSymbol > changed-symbol-result.txt
          cat changed-symbol-result.txt
          grep -q 'sample.js' changed-symbol-result.txt
          grep -q 'changedSymbol' changed-symbol-result.txt
          test -d .codegraph
          echo '--- Index recovery after deletion (disposable fixture only) ---'
          rm -rf .codegraph
          ./node_modules/.bin/codegraph init .
          ./node_modules/.bin/codegraph query --limit 10 -- changedSymbol > recovered-symbol-result.txt
          cat recovered-symbol-result.txt
          grep -q 'sample.js' recovered-symbol-result.txt
          grep -q 'changedSymbol' recovered-symbol-result.txt
          echo '--- Invalid index path must not be silently accepted ---'
          rm -rf .codegraph
          printf 'not an index directory' > .codegraph
          if ./node_modules/.bin/codegraph init . > invalid-index.log 2>&1; then
            echo 'CLI accepted a regular file in place of the index directory; inspect behavior'
            cat invalid-index.log
            exit 1
          fi
          rm -f .codegraph
          ./node_modules/.bin/codegraph init .
          ./node_modules/.bin/codegraph query --limit 10 -- changedSymbol > final-symbol-result.txt
          grep -q 'changedSymbol' final-symbol-result.txt
          echo '--- Real ASEN/Pi registered tool + genuine CodeGraph CLI ---'
          export PATH="$PWD/node_modules/.bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          npm ci --ignore-scripts
          node --import tsx --test tests/t07-real-asen-codegraph.test.ts
  architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process');if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==process.env.ASEN_EXPECTED_SHA)process.exit(1)"
      - name: Enforce ASEN upstream isolation boundary
        shell: bash
        run: node scripts/audit-upstream-boundary.mjs
  pi-support-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Semantic evidence admission gate
        run: node --import tsx --test tests/pi-support-matrix.test.ts tests/ecosystem-execution-receipts.test.ts tests/ecosystem-claims.test.ts tests/ecosystem-evidence-bundle.test.ts tests/pi-matrix-pty-helper.test.ts tests/pi-verifier-exit.test.ts tests/pi-matrix-cleanup.test.ts tests/ecosystem-package-receipts.test.ts
      - name: Pack exact candidate
        shell: bash
        run: npm pack --silent > matrix-package.txt
      - name: Run eight real Pi host cells
        shell: bash
        run: npm run verify:pi-matrix -- "$(cat matrix-package.txt)" matrix-evidence
      - name: Record executed contract and host evidence
        run: node scripts/ecosystem-execution-receipts.mjs contract-evidence matrix-evidence
      - name: Upload exact candidate matrix and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pi-support-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            matrix-evidence
            contract-evidence
          if-no-files-found: error
          retention-days: 14
  t05-r4-audit:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/t05-independent-review' &&
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN'
    needs: architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      ASEN_T05_BASE_SHA: 18e98728e2e39c8b1a4ebf66019574ee7d1b32a6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: R4 exact-candidate and scope integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/feat/t05-independent-review | cut -f1)" = "$ASEN_EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git merge-base --is-ancestor "$ASEN_T05_BASE_SHA" "$ASEN_EXPECTED_SHA"
          git diff --check "$ASEN_T05_BASE_SHA" "$ASEN_EXPECTED_SHA"
          git diff --name-status "$ASEN_T05_BASE_SHA" "$ASEN_EXPECTED_SHA" > r4-changed-files.txt
          test -s r4-changed-files.txt
          sha256sum r4-changed-files.txt > r4-changed-files.sha256
      - name: R4 static security and architecture audits
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run audit:upstream-boundary
          npm run audit:skills
          npm run audit:skill-parity
      - name: R4 real Git and process regression scenarios
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/pi-authority-temp-load.test.ts tests/pi-process-runner.test.ts tests/ordinary-review-workspace-flow.test.ts tests/background-job-journal.test.ts tests/workspace-writer-lease.test.ts tests/authorized-job-retry.test.ts tests/authorized-write-recovery.test.ts tests/t05-nvidia-review-workflow.test.ts 2>&1 | tee r4-scenarios.log
      - name: T04 hard-kill recovery and T05 writer authorization joint evidence
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/authorized-job-retry.test.ts tests/authorized-write-recovery.test.ts tests/background-job-journal.test.ts tests/workspace-writer-lease.test.ts 2>&1 | tee t04-t05-recovery-evidence.log
      - name: Preserve real execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t05-r4-execution-${{ github.event.pull_request.head.sha }}
          path: |
            r4-scenarios.log
            t04-t05-recovery-evidence.log
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve R4 audit scope evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t05-r4-scope-${{ github.event.pull_request.head.sha }}
          path: |
            r4-changed-files.txt
            r4-changed-files.sha256
          if-no-files-found: warn
          retention-days: 30
  t04-t05-live-nvidia:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/t05-independent-review' &&
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN' &&
      vars.ASEN_ENABLE_LIVE_T04_T05_NVIDIA == 'true'
    needs: [test, pi-support-matrix, t05-r4-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: Verify exact clean provider candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/feat/t05-independent-review | cut -f1)" = "$ASEN_EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install pinned runtime without candidate package scripts
        working-directory: ${{ runner.temp }}
        run: npm install -g --ignore-scripts tsx@4.23.15 @earendil-works/pi-coding-agent@1.2.0
      - name: Real Pi 1.2.0 NVIDIA interruption, recovery, review, correction and acceptance
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/asen-t04-t05-pi-config
          ASEN_T05_EVIDENCE_DIR: ${{ runner.temp }}/asen-t04-t05-evidence
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY" || { echo "::error::NVIDIA_API_KEY missing; integrated Pi/NVIDIA evidence is BLOCKED"; exit 1; }
          mkdir -p "$PI_CODING_AGENT_DIR" "$ASEN_T05_EVIDENCE_DIR"
          timeout 1050s tsx scripts/t04-t05-nvidia-cycle.ts
          tsx scripts/t04-t05-integrated-verdict.ts
      - name: Preserve exact-SHA live T04/T05 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t04-t05-live-nvidia-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/asen-t04-t05-evidence/
          if-no-files-found: error
          retention-days: 30
