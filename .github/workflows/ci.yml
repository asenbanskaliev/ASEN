name: CI
on:
  # Cierre integral solo para PR listas y SHA vigente; cambios en borrador usan CI rápida.
  # Cada commit recibe CI rápida en otro flujo; un cambio posterior necesita
  # un nuevo cierre exact-SHA, nunca hereda aprobaciones del anterior.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'validacion-completa' && github.run_id || 'validation' }}
  cancel-in-progress: true
jobs:
  agentes-t02-t05-t06:
    if: >-
      github.event_name == 'push' || github.event.action == 'labeled' || github.event.pull_request.draft == false
    name: Megatanda T02–T10 y T11 (pruebas integradas sin modelos)
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Comprobar SHA exacto
        run: node -e "const {execFileSync}=require('node:child_process');if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==process.env.ASEN_EXPECTED_SHA)process.exit(1)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: npm ci --no-audit --no-fund
      - name: Compilar contratos y tipos
        run: |
          npm run typecheck
          npx --no-install tsc -p tsconfig.t08.json
          # El ensayo integral debe compilar antes de autorizar modelos reales.
          npx --no-install tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --skipLibCheck --types node scripts/e2a-native-partition-nvidia.ts
      - name: Pruebas específicas de la Megatanda B sin modelos externos
        run: |
          node --import tsx --test \
            tests/megatanda-b-continuation.test.ts \
            tests/megatanda-b-terminal-pi.test.ts \
            tests/megatanda-b-parallel-runtime.test.ts
      - name: Pruebas quirúrgicas de la Megatanda C sin llamadas externas
        run: |
          node --import tsx --test \
            tests/megatanda-c-review-policy.test.ts \
            tests/review-assessment-policy.test.ts \
            tests/ordinary-review-assessment.test.ts \
            tests/judgment-day.test.ts \
            tests/review-acceptance.test.ts
      - name: Regresión Megatanda D del host Pi, permisos y plan completo
        run: |
          node --import tsx --test \
            tests/pi-agent-runtime.test.ts \
            tests/megatanda-d-e2e-pi.test.ts
      - name: Probar lectura de catálogo NVIDIA sin generación ni red
        run: node --test tests/catalogo-nvidia.test.mjs
      - name: Probar diagnóstico NVIDIA con respuestas simuladas y sin gasto
        run: node --test tests/comprobar-nvidia.test.mjs
      - name: Aislamiento, modelos, recibos y permisos por Worker
        run: |
          node --import tsx --test \
            tests/runtime-profiles.test.ts \
            tests/odd-agent-review-flow.test.ts \
            tests/pi-model-reviewer.test.ts \
            tests/judgment-day.test.ts \
            tests/judgment-fix-odd-save.test.ts \
            tests/fix-odd-real-plan-persistence.test.ts \
            tests/parallel-parent-supervisor-claims.test.ts \
            tests/parallel-worker-model-route.test.ts \
            tests/parallel-worktree-todos.test.ts \
            tests/t06-pi-receipt-validator.test.ts \
            tests/t06-read-only-git-fixture.test.ts \
            tests/t06-live-consent.test.ts \
            tests/t06-native-review-receipt.test.ts \
            tests/t06-github-approvals.test.ts \
            tests/t06-github-workflow-boundary.test.ts \
            tests/t06-writer-evidence.test.ts \
            tests/t06-static-write-evidence.test.ts \
            tests/t06-behavior-handoff.test.ts \
            tests/t06-github-reviewer-approvals.test.ts \
            tests/t06-independent-review-admission.test.ts \
            tests/t06-review-replay.test.ts \
            tests/t06-review-failure-diagnostic.test.ts \
            tests/t06-javascript-syntax.test.ts \
            tests/pi-authority.test.ts \
            tests/t09-native-trial-readiness.test.ts \
            tests/t09-audit-script.test.ts \
            tests/t08-github-approvals.test.ts \
            tests/t08-controlled-fixture.test.ts \
            tests/t08-github-workflow-boundary.test.ts \
            tests/generated-code-trial-admission.test.ts \
            tests/t08-isolated-repository.test.ts \
            tests/t08-pi-review-text.test.ts \
            tests/t08-pi-review-diagnostics.test.ts \
            tests/t08-pi-settlement.test.ts \
            tests/pi-artifact-runner-cancellation.test.ts \
            tests/pi-artifact-runner-recovery.test.ts \
            tests/ordinary-review-assessment.test.ts \
            tests/odd-agent-review-command.test.ts \
            tests/agent-flow-overview.test.ts \
            tests/agent-flow-ab-comparison.test.ts \
            tests/agent-flow-ab-series.test.ts \
            tests/parallel-worktree-change-inspection.test.ts \
            tests/parallel-worktree-reconciliation.test.ts \
            tests/panel-observation-integration.test.ts \
            tests/t06-t07-trial-evidence.test.ts \
            tests/review-acceptance.test.ts \
            tests/review-acceptance-receipt.test.ts \
            tests/t11-git-observation.test.ts \
            tests/t11-rail-observer.test.ts \
            tests/t11-native-rail.test.ts \
            tests/flujo-agentes-nvidia-workflow.test.ts
  test:
    if: >-
      github.event_name == 'push' || github.event.action == 'labeled' || github.event.pull_request.draft == false
    name: test (${{ matrix.os }} shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {os: ubuntu-24.04, shard: 0, count: 1}
          - {os: windows-latest, shard: 0, count: 4}
          - {os: windows-latest, shard: 1, count: 4}
          - {os: windows-latest, shard: 2, count: 4}
          - {os: windows-latest, shard: 3, count: 4}
          - {os: macos-latest, shard: 0, count: 2}
          - {os: macos-latest, shard: 1, count: 2}
    runs-on: ${{ matrix.os }}
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASEN_TEST_SHARD_OS: ${{ matrix.os }}
      ASEN_TEST_SHARD_INDEX: ${{ matrix.shard }}
      ASEN_TEST_SHARD_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process');if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==process.env.ASEN_EXPECTED_SHA)process.exit(1)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - name: Verify EF checklist against traceable evidence
        if: matrix.shard == 0
        run: npm run audit:ef-plan
      - name: Prepare frozen ecosystem Git objects
        run: node .github/scripts/prepare-frozen-ecosystem-baseline.mjs
      # Same checks and order as npm run check, split into timed Actions steps.
      - name: Typecheck
        if: matrix.shard == 0
        run: npm run typecheck
      - name: Full test suite
        env:
          ASEN_TEST_CHUNK_TIMEOUT_MS: "900000"
          ASEN_TEST_OVERALL_TIMEOUT_MS: ${{ matrix.os == 'windows-latest' && '2400000' || '1800000' }}
        run: npm test
      - name: Record exact-SHA successful shard manifest
        run: node scripts/ci-shard-receipts.mjs emit
      - name: Upload exact-SHA shard manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-ci-shard-${{ matrix.os }}-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-shard-receipts/${{ matrix.os }}-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
      - name: macOS retained-source witness
        if: runner.os == 'macOS' && matrix.shard == 0
        shell: bash
        run: |
          set +e
          set -o pipefail
          node .github/scripts/run-retained-ecosystem-source-witness.mjs 2>&1 | tee retained-source-witness.log
          witness_status=${PIPESTATUS[0]}
          printf '%s\n' "$witness_status" > retained-source-witness.exit
          exit "$witness_status"
      - name: Upload macOS retained-source witness
        if: always() && runner.os == 'macOS' && matrix.shard == 0
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: retained-source-macos-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            retained-source-witness.log
            retained-source-witness.exit
          if-no-files-found: error
          retention-days: 14
      - name: Phase parity audit
        if: matrix.shard == 0
        run: npm run audit:parity
      - name: Skills audit
        if: matrix.shard == 0
        run: npm run audit:skills
      - name: Skill parity audit
        if: matrix.shard == 0
        run: npm run audit:skill-parity
      - name: Memory parity audit
        if: matrix.shard == 0
        run: npm run audit:memory-parity
      - name: Ecosystem audit
        if: matrix.shard == 0
        run: npm run audit:ecosystem
      - name: Upstream boundary audit
        if: matrix.shard == 0
        run: npm run audit:upstream-boundary

  test-shard-coverage:
    name: test-shard-coverage
    needs: test
    if: >-
      always() && (github.event_name == 'push' || github.event.action == 'labeled' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject incomplete matrix before evidence admission
        env:
          ASEN_TEST_MATRIX_RESULT: ${{ needs.test.result }}
        run: node -e "if(process.env.ASEN_TEST_MATRIX_RESULT!=='success')process.exit(1)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - name: Download six same-run exact-SHA shard receipts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: asen-ci-shard-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-shard-receipts
          merge-multiple: true
      - name: Reject missing, duplicate, stale or overlapping test coverage
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-shard-receipts.mjs verify

  t07-real-codegraph:
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'feat/t07-codegraph-completion' ||
       github.head_ref == 'feat/t12-integrated-acceptance' ||
       github.head_ref == 'feat/t12-integrated-acceptance-merge' ||
       (github.head_ref == 'fix/ci-portable-baseline-20261113' &&
        github.base_ref == 'feat/t12-integrated-acceptance-merge')) &&
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 24
      - name: Genuine CodeGraph CLI lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/t07-codegraph"
          cd "${RUNNER_TEMP}/t07-codegraph"
          git init -q
          git config user.email "probe@example.invalid"
          git config user.name "T07 Probe"
          printf 'export function calculateTotal(a,b) { return a+b; }\\n' > sample.js
          git add sample.js
          git commit -qm initial
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact @colbymchenry/codegraph
          node -p "require('./node_modules/@colbymchenry/codegraph/package.json').version"
          ./node_modules/.bin/codegraph --help
          ./node_modules/.bin/codegraph init --help
          ./node_modules/.bin/codegraph query --help
          ./node_modules/.bin/codegraph explore --help
          ./node_modules/.bin/codegraph init .
          ./node_modules/.bin/codegraph query --limit 10 -- calculateTotal
          ./node_modules/.bin/codegraph explore -- calculateTotal
          printf 'export function changedSymbol() { return 42; }\\n' > sample.js
          git add sample.js
          git commit -qm changed
          ./node_modules/.bin/codegraph sync
          ./node_modules/.bin/codegraph query --limit 10 -- changedSymbol > changed-symbol-result.txt
          cat changed-symbol-result.txt
          grep -q 'sample.js' changed-symbol-result.txt
          grep -q 'changedSymbol' changed-symbol-result.txt
          test -d .codegraph
          echo '--- Index recovery after deletion (disposable fixture only) ---'
          rm -rf .codegraph
          ./node_modules/.bin/codegraph init .
          ./node_modules/.bin/codegraph query --limit 10 -- changedSymbol > recovered-symbol-result.txt
          cat recovered-symbol-result.txt
          grep -q 'sample.js' recovered-symbol-result.txt
          grep -q 'changedSymbol' recovered-symbol-result.txt
          echo '--- Invalid index path must not be silently accepted ---'
          rm -rf .codegraph
          printf 'not an index directory' > .codegraph
          if ./node_modules/.bin/codegraph init . > invalid-index.log 2>&1; then
            echo 'CLI accepted a regular file in place of the index directory; inspect behavior'
            cat invalid-index.log
            exit 1
          fi
          rm -f .codegraph
          ./node_modules/.bin/codegraph init .
          ./node_modules/.bin/codegraph query --limit 10 -- changedSymbol > final-symbol-result.txt
          grep -q 'changedSymbol' final-symbol-result.txt
          echo '--- Real ASEN/Pi registered tool + genuine CodeGraph CLI ---'
          export ASEN_T07_CODEGRAPH_PACKAGE_ROOT="$PWD/node_modules/@colbymchenry/codegraph"
          cd "$GITHUB_WORKSPACE"
          npm ci --ignore-scripts
          node --import tsx --test tests/t07-real-asen-codegraph.test.ts
  t12-integrated-security:
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'feat/t12-integrated-acceptance' ||
       github.head_ref == 'feat/t12-integrated-acceptance-merge' ||
       (github.head_ref == 'fix/ci-portable-baseline-20261113' &&
        github.base_ref == 'feat/t12-integrated-acceptance-merge')) &&
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - name: Verify exact candidate and checks
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          npm ci --ignore-scripts
          npm run typecheck
          npm run audit:upstream-boundary
      - name: Provider-free integrated security journeys
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/t12-integrated-boundaries.test.ts tests/workspace-resolution.test.ts tests/shared-session-directory.test.ts tests/workspace-writer-lease.test.ts tests/workspace-attribution.test.ts tests/workspace-snapshot.test.ts tests/t09-lifecycle.test.ts tests/code-intelligence.test.ts 2>&1 | tee t12-integrated-security.log
      - name: Retain exact-SHA security receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: t12-security-${{ github.event.pull_request.head.sha }}
          path: t12-integrated-security.log
          if-no-files-found: warn
          retention-days: 30
  t12-real-pi-tui-dialog:
    name: t12-real-pi-tui-dialog (${{ matrix.os }})
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'feat/t12-integrated-acceptance' ||
       github.head_ref == 'feat/t12-integrated-acceptance-merge' ||
       (github.head_ref == 'fix/ci-portable-baseline-20261113' &&
        github.base_ref == 'feat/t12-integrated-acceptance-merge')) &&
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - name: Install pinned real Pi and node-pty
        run: npm ci
      - name: Drive real Pi T10 selection, editor cancellation and user-approved write
        shell: bash
        run: |
          set -euo pipefail
          node scripts/t12-pi-native-supervisor.mjs cancel
          node scripts/t12-pi-native-supervisor.mjs apply
      - name: Drive real Pi 1.2 T10 responsive views
        shell: bash
        run: |
          set -euo pipefail
          node scripts/t10-real-pi-tui-matrix.mjs 120,80,60,40,139,140,160
      - name: Retain exact-candidate real UI receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: t12-real-pi-tui-${{ runner.os }}-${{ github.event.pull_request.head.sha }}
          path: t12-real-pi-tui-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain exact-candidate real UI receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: t10-real-pi-tui-${{ runner.os }}-${{ github.event.pull_request.head.sha }}
          path: t10-real-pi-tui-matrix-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30
  architecture:
    if: >-
      github.event_name == 'push' || github.event.action == 'labeled' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const {execFileSync}=require('node:child_process');if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==process.env.ASEN_EXPECTED_SHA)process.exit(1)"
      - name: Enforce ASEN upstream isolation boundary
        shell: bash
        run: node scripts/audit-upstream-boundary.mjs
  pi-support-matrix:
    if: >-
      github.event_name == 'push' || github.event.action == 'labeled' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - name: Semantic evidence admission gate
        run: node --import tsx --test tests/pi-support-matrix.test.ts tests/ecosystem-execution-receipts.test.ts tests/ecosystem-claims.test.ts tests/ecosystem-evidence-bundle.test.ts tests/pi-matrix-pty-helper.test.ts tests/pi-verifier-exit.test.ts tests/pi-matrix-cleanup.test.ts tests/ecosystem-package-receipts.test.ts
      - name: Pack exact candidate
        shell: bash
        run: npm pack --silent > matrix-package.txt
      - name: Run eight real Pi host cells
        shell: bash
        run: npm run verify:pi-matrix -- "$(cat matrix-package.txt)" matrix-evidence
      - name: Record executed contract and host evidence
        run: node scripts/ecosystem-execution-receipts.mjs contract-evidence matrix-evidence
      - name: Upload exact candidate matrix and receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: pi-support-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            matrix-evidence
            contract-evidence
          if-no-files-found: error
          retention-days: 14
  cierre-puntos-16-17-18:
    name: Auditar compatibilidad Pi y evidencias 17/16 sin proveedores
    needs: [pi-support-matrix]
    if: needs.pi-support-matrix.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - name: Comprobar revisión exacta e instalar pruebas sin ejecutar scripts
        shell: bash
        run: |
          set -euo pipefail
