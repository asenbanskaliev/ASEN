name: Comprobar compatibilidad Pi 1.5 y 1.6 sin modelos
on:
  pull_request:
    paths:
      - "scripts/pi-support-matrix.mjs"
      - "tests/pi-support-matrix.test.ts"
      - ".github/workflows/pi-compatibility-1_5.yml"
permissions:
  contents: read
concurrency:
  group: asen-pi15-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pi15:
    name: Pi 1.5.2 y 1.6.0 ${{ matrix.os }} (prueba adicional)
    if: >-
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN' &&
      (github.head_ref == 'feat/flujo-de-agentes-20261115' ||
       startsWith(github.head_ref, 'feat/asen-equipo-E-M2-'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      ASEN_PI_MATRIX_EXTRA_VERSIONS: "1.5.2,1.6.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
      - name: Verificar revisión exacta e instalar paquetes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          npm ci --no-audit --no-fund
          node --import tsx --test tests/pi-support-matrix.test.ts
      - name: Empaquetar el código comprobado
        shell: bash
        run: npm pack --silent > pi15-package.txt
      - name: Comprobar Pi 1.2, 1.5.2 y 1.6.0 reales sin hacer llamadas a modelos
        shell: bash
        run: npm run verify:pi-matrix -- "$(cat pi15-package.txt)" pi15-evidence
      - name: Conservar las pruebas y sus fallos por sistema
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-pi16-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: pi15-evidence
          if-no-files-found: error
          retention-days: 14
