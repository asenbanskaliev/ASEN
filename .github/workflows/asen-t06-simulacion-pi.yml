name: T06 simulación local de petición Pi sin NVIDIA
on:
  pull_request:
    branches:
      - feat/flujo-de-agentes-20261115
    paths:
      - scripts/t06-pi-peticion-simulada.mjs
      - scripts/t06-aislamiento-modelos-nvidia.mjs
      - scripts/t06-autorrevision-nvidia.ts
      - src/runtime/agents/t06-auto-review-authority.ts
      - .github/workflows/asen-t06-autorrevision-nvidia.yml
      - .github/workflows/asen-t06-simulacion-pi.yml
permissions:
  contents: read
jobs:
  comprobar:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN' &&
      github.actor == 'asenbanskaliev'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
      - name: Instalar Pi sin credenciales de proveedores
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.5.2
          test "$(pi --version | tr -d '\r')" = "1.5.2"
      - name: Comprobar la petición real de Pi con respuesta local simulada
        shell: bash
        run: |
          set -euo pipefail
          test -z "${NVIDIA_API_KEY:-}"
          timeout 75s node scripts/t06-pi-peticion-simulada.mjs
