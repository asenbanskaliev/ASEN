name: Memory OpenRouter E2E
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  memory-openrouter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Install Pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.87.1
      - name: Execute synthetic memory restart and model recall
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ASEN_PI_PROVIDER: openrouter
          ASEN_PI_MODEL: qwen/qwen3.8-27b:free
        run: |
          test -n "$OPENROUTER_API_KEY"
          node --import tsx scripts/pi-free-memory-e2e.mjs
