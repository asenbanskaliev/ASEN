name: Memory OpenRouter E2E
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Elegir memoria, T06 Writer, T08 reparación o flujo de agentes NVIDIA de lectura'
        required: true
        type: choice
        default: memoria
        options:
          - memoria
          - t06
          - t06_revision
          - nvidia_catalogo
          - nvidia_diagnostico
          - t08
          - flujo
      candidate_sha:
        description: 'SHA de 40 caracteres (en t06_revision se usa automáticamente el SHA real del disparo)'
        required: false
        type: string
      t06_revisor_a:
        description: 'T06: modelo NVIDIA revisor A, diferente de Nemotron Writer'
        required: false
        type: string
      t06_revisor_b:
        description: 'T06: modelo NVIDIA revisor B, distinto de A y del Writer'
        required: false
        type: string
      t08_revisor_a:
        description: 'T08: modelo NVIDIA A (proveedor/modelo)'
        required: false
        type: string
      t08_revisor_b:
        description: 'T08: modelo NVIDIA B distinto (proveedor/modelo)'
        required: false
        type: string
      t08_modelo_reparador:
        description: 'T08: modelo NVIDIA escritor distinto de los jueces'
        required: false
        type: string
      coste_desconocido_autorizado:
        description: 'Acepto expresamente el posible coste desconocido de NVIDIA'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  memory-openrouter:
    if: inputs.modo == 'memoria'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22
      - run: npm install
      - name: Install Pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.2.0
      - name: Execute synthetic memory restart and model recall
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ASEN_PI_PROVIDER: openrouter
          ASEN_PI_MODEL: nvidia/nemotron-3.5-lightning:free
        run: |
          test -n "$OPENROUTER_API_KEY"
          node --import tsx scripts/pi-free-memory-e2e.mjs

  t06-escritura-con-aprobaciones:
    if: inputs.modo == 't06' && github.repository == 'asenbanskaliev/ASEN' && github.ref == 'refs/heads/feat/flujo-de-agentes-20261115'
    uses: ./.github/workflows/t06-github-approved-writers.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      cost_acknowledged: ${{ inputs.coste_desconocido_autorizado }}
      reviewer_a: ${{ inputs.t06_revisor_a }}
      reviewer_b: ${{ inputs.t06_revisor_b }}
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

  t06-revision-de-evidencias-existentes:
    if: inputs.modo == 't06_revision' && github.repository == 'asenbanskaliev/ASEN' && github.ref == 'refs/heads/feat/flujo-de-agentes-20261115'
    uses: ./.github/workflows/t06-review-only.yml
    with:
      # Evita SHA introducidos erróneamente: GitHub fija el mismo commit del disparo.
      # La comprobación de SHA exacto sigue activa en el workflow reutilizable.
      candidate_sha: ${{ github.sha }}
      reviewer_a: ${{ inputs.t06_revisor_a }}
      reviewer_b: ${{ inputs.t06_revisor_b }}
      coste_desconocido_autorizado: ${{ inputs.coste_desconocido_autorizado }}
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

  catalogo-nvidia-sin-generacion:
    if: inputs.modo == 'nvidia_catalogo' && github.repository == 'asenbanskaliev/ASEN' && github.ref == 'refs/heads/feat/flujo-de-agentes-20261115'
    uses: ./.github/workflows/catalogo-nvidia.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

  comprobar-nvidia:
    if: inputs.modo == 'nvidia_diagnostico' && github.repository == 'asenbanskaliev/ASEN' && github.ref == 'refs/heads/feat/flujo-de-agentes-20261115'
    uses: ./.github/workflows/comprobar-nvidia.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      coste_desconocido_autorizado: ${{ inputs.coste_desconocido_autorizado }}
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

  t08-reparacion-con-aprobaciones:
    if: inputs.modo == 't08' && github.repository == 'asenbanskaliev/ASEN' && github.ref == 'refs/heads/feat/flujo-de-agentes-20261115'
    uses: ./.github/workflows/t08-github-approved-fix.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      cost_acknowledged: ${{ inputs.coste_desconocido_autorizado }}
      reviewer_a: ${{ inputs.t08_revisor_a }}
      reviewer_b: ${{ inputs.t08_revisor_b }}
      writer_model: ${{ inputs.t08_modelo_reparador }}
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

  flujo-agentes-nvidia:
    if: inputs.modo == 'flujo' && github.repository == 'asenbanskaliev/ASEN' && github.ref == 'refs/heads/feat/flujo-de-agentes-20261115'
    uses: ./.github/workflows/asen-flujo-agentes-nvidia.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      cost_acknowledged: ${{ inputs.coste_desconocido_autorizado }}
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
