name: F5 exact-SHA static verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  authority-pin:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/t12-integrated-acceptance-merge' &&
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22.19.0"
      - name: Exact SHA and read-only authority pin verification
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
          npm run check:authority-pin
          echo "F5_AUTHORITY_PIN_PASS sha=$ASEN_EXPECTED_SHA"
  actionlint:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/t12-integrated-acceptance-merge' &&
      github.event.pull_request.head.repo.full_name == 'asenbanskaliev/ASEN'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact F5 SHA
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
      - name: Install pinned actionlint v1.7.12
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash -o actionlint-installer.bash
          bash ./actionlint-installer.bash 1.7.12
          ./actionlint -version
      - name: Validate all GitHub Actions workflows
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ./actionlint -color
          echo "F5_ACTIONLINT_PASS sha=$ASEN_EXPECTED_SHA"
