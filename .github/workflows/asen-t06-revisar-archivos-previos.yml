name: T06 verificar Writers previos sin volver a gastar NVIDIA
# Repite SOLO 17 pruebas sin red; no ejecuta escritores ni proveedores.
on:
  push:
    branches:
      - feat/flujo-de-agentes-20261115
    paths:
      - .github/workflows/asen-t06-revisar-archivos-previos.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: asen-t06-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comprobar-codigo-generado:
    if: >-
      github.repository == 'asenbanskaliev/ASEN' &&
      github.event_name == 'push' &&
      github.actor == 'asenbanskaliev' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/feat/flujo-de-agentes-20261115' &&
      github.event.head_commit.message == 'ci(asen): verificar T06 sin NVIDIA'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASEN_EXPECTED_SHA: 5bd752374f2db630a9d2ab0887e1025134a4e13f
      ASEN_T06_VERIFIER_SHA: ${{ github.sha }}
      ASEN_T06_SOURCE_RUN_ID: "44792916571"
      ASEN_T06_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      ASEN_T06_OWNER_OFFLINE_REPLAY: "1"
      ASEN_T06_ISOLATED_REPLAY: "1"
      ASEN_DOCKER_TESTS_CI: "1"
      ASEN_DOCKER_NODE_IMAGE: "node@sha256:a34ab6d7f6f4813f4d0c5469d74685604b962fbdbf5793a7bc7b4998ecb867c8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
      - name: Comprobar código y permisos antes de leer el artefacto
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ASEN_T06_VERIFIER_SHA"
          test -z "$(printenv NVIDIA_API_KEY || true)"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          node --import tsx --test tests/generated-code-docker-sandbox.test.ts tests/t06-behavior-handoff.test.ts
          node --import tsx --input-type=module -e "import {isGithubHostedT06OwnerReplayRun} from './src/runtime/agents/generated-code-docker-sandbox.ts';if(!isGithubHostedT06OwnerReplayRun())process.exit(1)"
      - name: Recuperar exclusivamente los Writers del run NVIDIA original
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          run-id: 44792916571
          name: asen-t06-writers-auto-5bd752374f2db630a9d2ab0887e1025134a4e13f-44792916571
          path: ${{ runner.temp }}/asen-t06-replay-archivos
          github-token: ${{ github.token }}
      - name: Verificar 17 casos en Docker sin red, sin credenciales y con imagen fijada
        shell: bash
        env:
          ASEN_T06_ISOLATED_DIR: ${{ runner.temp }}/asen-t06-replay-archivos
          ASEN_T06_SANDBOX_REPORT_DIR: ${{ runner.temp }}/asen-t06-replay-informe
        run: |
          set -euo pipefail
          test -z "$(printenv NVIDIA_API_KEY || true)"
          test -z "$(printenv GITHUB_TOKEN || true)"
          docker pull "$ASEN_DOCKER_NODE_IMAGE"
          docker image inspect "$ASEN_DOCKER_NODE_IMAGE" >/dev/null
          node --import tsx scripts/t06-verificar-codigo-aislado-github.ts
      - name: Guardar resultados reales de los 17 casos sin aprobar el plan entero
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.4.3
        with:
          name: asen-t06-17-casos-replay-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/asen-t06-replay-informe/t06-veredicto-aislado.json
          if-no-files-found: warn
          retention-days: 14
