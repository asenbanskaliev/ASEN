name: Phase 0 Architecture

on:
  pull_request:
  push:
    branches:
      - architecture/phase-0

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate checkout
        shell: bash
        env:
          ASEN_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ASEN_EXPECTED_SHA"
      - name: Audit all tracked references
        shell: bash
        run: node scripts/audit-upstream-boundary.mjs
      - name: Require frozen upstream baselines
        shell: bash
        run: |
          test -f registry/upstream/reference-a.yaml
          test -f registry/upstream/reference-b.yaml
          test -f registry/upstream/reference-c.yaml
