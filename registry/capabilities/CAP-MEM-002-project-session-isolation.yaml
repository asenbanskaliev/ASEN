id: CAP-MEM-002
name: Project/session memory isolation
priority: P0
status: specified
owner: ASEN-Memory
references:
  engram:
    commit: 618e30f68f0f2e3b736df91fcfbaaad279ccd3d2
contract:
  given: memory is written from an active Pi session
  when: ASEN persists or retrieves project memory
  then:
    - project identity is explicit
    - session identity is explicit
    - memory from another project is not silently written or injected
tests: [unit, integration, pi-e2e, security]
evidence_required: true
